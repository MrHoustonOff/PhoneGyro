p{margin:0 0 26px;color:#b8b8b8;max-width:32em}
.b{display:flex;flex-wrap:wrap;gap:12px}

a.btn:hover{transform:translateY(-2px)}
.p{background:var(--paper);color:var(--ink)}.s{border:1px solid rgba(255,255,255,.18);color:var(--paper)}
.nf-art svg{display:block;width:100%;height:auto;filter:drop-shadow(0 30px 50px rgba(0,0,0,.5))}
.lp-mz__t--leaf{fill:var(--leaf)}.lp-mz__t--paper{fill:var(--paper)}.lp-mz__t--teal{fill:var(--teal)}.lp-mz__t--coral{fill:var(--coral)}.lp-mz__t--amber{fill:var(--amber)}.lp-mz__t--cream{fill:var(--cream)}
.lp-mz__rings circle{fill:none;stroke:var(--ink);stroke-width:4.5}.lp-mz__rings .lp-mz__dot{fill:var(--ink);stroke:none}
@media (max-width:800px){main{grid-template-columns:1fr;gap:28px}.nf-art{order:-1}}
