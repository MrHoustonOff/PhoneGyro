name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        shell: powershell

      - name: Compute Version
        id: version
        shell: powershell
        run: |
          # A tag push (v*) is the only thing this workflow treats as an official
          # release build (channel=release, build=000): the checkout is exactly that
          # tag, so there are zero commits on top of it by definition. A manual
          # workflow_dispatch run (no tag) is a dev build; leave -ldflags empty and
          # let the app's own git-based fallback (gui/version.go) figure it out.
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v',''
            $ldflags = "-X main.releaseVersion=$ver -X main.buildTag=000 -X main.buildChannel=release"

            # Stamp the tag into the exe's file properties (wails.json -> version
            # resource and manifest), so "Properties > Details" always matches the
            # release. Windows wants four numbers: "2.0.1-rc1" -> "2.0.1.0".
            if ($ver -match '^(\d+)\.(\d+)\.(\d+)') {
              $num = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
              $cfg = Get-Content gui/wails.json -Raw -Encoding UTF8 | ConvertFrom-Json
              $cfg.version = $num
              $cfg.info.productVersion = "$num.0"
              # UTF-8 without BOM: Go's JSON parser rejects a BOM.
              [System.IO.File]::WriteAllText((Join-Path (Get-Location) "gui/wails.json"), ($cfg | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding $false))
              Write-Host "File version stamped: $num.0"
            }
          } else {
            $ldflags = ""
          }
          echo "ldflags=$ldflags" >> $env:GITHUB_OUTPUT

      - name: Build Windows AMD64 (x86_64)
        run: |
          cd gui
          wails build -tags native_webview2loader -ldflags "${{ steps.version.outputs.ldflags }}" -o PhoneGyro-windows-amd64.exe
          Copy-Item build\bin\PhoneGyro-windows-amd64.exe build\bin\PhoneGyro.exe
        shell: powershell

      - name: Build Windows ARM64
        run: |
          cd gui
          wails build -platform windows/arm64 -tags native_webview2loader -ldflags "${{ steps.version.outputs.ldflags }}" -o PhoneGyro-windows-arm64.exe
        shell: powershell

      - name: Generate Checksums
        run: |
          cd gui\build\bin
          Get-FileHash PhoneGyro.exe, PhoneGyro-windows-amd64.exe, PhoneGyro-windows-arm64.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content SHA256SUMS.txt
        shell: powershell

      - name: Analyze with VirusTotal & Prepare Release Notes
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          $amd64Path = "gui\build\bin\PhoneGyro-windows-amd64.exe"
          $arm64Path = "gui\build\bin\PhoneGyro-windows-arm64.exe"
          $amd64Hash = (Get-FileHash $amd64Path -Algorithm SHA256).Hash.ToLower()
          $arm64Hash = (Get-FileHash $arm64Path -Algorithm SHA256).Hash.ToLower()

          Write-Host "AMD64 SHA-256: $amd64Hash"
          Write-Host "ARM64 SHA-256: $arm64Hash"

          if ($env:VT_API_KEY) {
            Write-Host "Submitting release binaries to VirusTotal..."

            foreach ($file in @($amd64Path, $arm64Path)) {
              try {
                $item = Get-Item $file
                Write-Host "Uploading $($item.Name) ($([math]::Round($item.Length/1MB, 2)) MB)..."

                $uploadUrl = "https://www.virustotal.com/api/v3/files"
                if ($item.Length -gt 32MB) {
                  $urlRaw = curl.exe -s -S -X GET "https://www.virustotal.com/api/v3/files/upload_url" -H "x-apikey: $env:VT_API_KEY"
                  $urlJson = $urlRaw | ConvertFrom-Json
                  if ($urlJson.data) {
                    $uploadUrl = $urlJson.data
                  }
                }

                $respRaw = curl.exe -s -S -X POST $uploadUrl -H "x-apikey: $env:VT_API_KEY" -F "file=@$($item.FullName)"
                $respJson = $respRaw | ConvertFrom-Json
                if ($respJson.data.id) {
                  Write-Host "Upload completed successfully. Analysis ID: $($respJson.data.id)"
                } else {
                  Write-Warning "VirusTotal API response: $respRaw"
                }
              } catch {
                Write-Warning "VirusTotal upload error for $($file): $_"
              }
            }
          } else {
            Write-Warning "VT_API_KEY secret not found or empty, skipping upload."
          }

          # Windows PowerShell 5.1 reads BOM-less files as ANSI: be explicit, or any
          # non-ASCII text (emoji, arrows, Cyrillic) in the notes turns into mojibake.
          $notes = Get-Content docs/RELEASE_NOTES.md -Raw -Encoding UTF8
          $vtLines = @(
            "",
            "### VirusTotal Verification Reports",
            "- **Windows x86_64 (``PhoneGyro.exe``)**: [VirusTotal Scan Report](https://www.virustotal.com/gui/file/$amd64Hash)",
            "  SHA-256: ``$amd64Hash``",
            "- **Windows ARM64 (``PhoneGyro-windows-arm64.exe``)**: [VirusTotal Scan Report](https://www.virustotal.com/gui/file/$arm64Hash)",
            "  SHA-256: ``$arm64Hash``"
          )
          $fullNotes = $notes + [Environment]::NewLine + ($vtLines -join [Environment]::NewLine)
          # UTF-8 without BOM: a BOM ends up as a stray character before the title.
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "RELEASE_NOTES_COMPOSED.md"), $fullNotes, (New-Object System.Text.UTF8Encoding $false))
        shell: powershell

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try { gh release delete ${{ github.ref_name }} --yes } catch { }
          gh release create ${{ github.ref_name }} `
            --title "PhoneGyro ${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES_COMPOSED.md `
            gui/build/bin/PhoneGyro.exe `
            gui/build/bin/PhoneGyro-windows-amd64.exe `
            gui/build/bin/PhoneGyro-windows-arm64.exe `
            gui/build/bin/SHA256SUMS.txt
        shell: powershell
