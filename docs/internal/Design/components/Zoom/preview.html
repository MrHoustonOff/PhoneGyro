<!-- @dsCard group="Layout" height=270 width=900 subtitle="Interface zoom 50-300 %, default 100 %: steps, keys, feedback toast" -->
<div class="pg-app" style="padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div style="display:flex;flex-direction:column;gap:14px"><div class="pg-overline"><span class="pg-ring"></span>Steps</div>
<div style="display:flex;flex-wrap:wrap;gap:6px"><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">50%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">60%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">70%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">80%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">90%</span><span class="pg-badge pg-badge--ok" style="height:26px;min-width:52px;justify-content:center">100%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">110%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">125%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">150%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">175%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">200%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">250%</span><span class="pg-badge" style="height:26px;min-width:52px;justify-content:center">300%</span></div>
<div class="pg-overline" style="margin-top:8px"><span class="pg-ring"></span>Feedback toast (1.6 s)</div><div style="display:flex;gap:12px;flex-wrap:wrap"><div class="pg-zoomtoast is-on" style="position:static;transform:none"><span>125%</span><small>Ctrl 0</small><button class="pg-btn" type="button">Reset</button></div><div class="pg-zoomtoast is-on" style="position:static;transform:none"><span>100%</span><small>Ctrl 0</small><button class="pg-btn" type="button">Reset</button></div></div></div>
<div style="display:flex;flex-direction:column;gap:14px"><div class="pg-overline"><span class="pg-ring"></span>Keys</div><div class="pg-group__list"><div class="pg-row"><div class="pg-row__label"><span class="pg-kbd">Ctrl +</span></div><div class="pg-row__control" style="color:var(--ink-2);font-size:13px">next step up</div></div><div class="pg-row"><div class="pg-row__label"><span class="pg-kbd">Ctrl −</span></div><div class="pg-row__control" style="color:var(--ink-2);font-size:13px">next step down</div></div><div class="pg-row"><div class="pg-row__label"><span class="pg-kbd">Ctrl 0</span></div><div class="pg-row__control" style="color:var(--ink-2);font-size:13px">back to 100%</div></div><div class="pg-row"><div class="pg-row__label"><span class="pg-kbd">Ctrl + wheel</span></div><div class="pg-row__control" style="color:var(--ink-2);font-size:13px">±10%, touchpad pinch works too</div></div></div></div></div>
