<div class="pg-app" style="padding:20px"><div style="max-width:640px" class="pg-group">

<div class="pg-row"><div class="pg-row__label">DSU Port (Cemuhook)<button class="pg-info" aria-label="Info">i</button></div><div class="pg-row__control"><input class="pg-input pg-input--num" value="26760"></div></div>
