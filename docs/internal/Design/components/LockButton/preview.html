<div class="pg-app" style="padding:20px"><div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap"><div class="pg-lock " style="flex:none;gap:0;width:200px;height:200px;justify-content:center"><button class="pg-lockbtn " style="--hold:0" aria-label="Hold to unlock"><svg class="pg-lockbtn__ring" viewBox="0 0 176 176"><circle class="pg-lockbtn__track" cx="88" cy="88" r="82"/><circle class="pg-lockbtn__prog" cx="88" cy="88" r="82"/></svg><svg class="pg-lockbtn__icon" viewBox="0 0 64 64"><rect x="15" y="29" width="34" height="25" rx="7"/><path class="shackle" d="M22 29V22a10 10 0 0 1 20 0v7"/><circle cx="32" cy="41" r="2.6"/><path d="M32 44v4"/></svg></button></div><div class="pg-lock is-holding" style="flex:none;gap:0;width:200px;height:200px;justify-content:center"><button class="pg-lockbtn is-holding" style="--hold:0.6" aria-label="Hold to unlock"><svg class="pg-lockbtn__ring" viewBox="0 0 176 176"><circle class="pg-lockbtn__track" cx="88" cy="88" r="82"/><circle class="pg-lockbtn__prog" cx="88" cy="88" r="82"/></svg><svg class="pg-lockbtn__icon" viewBox="0 0 64 64"><rect x="15" y="29" width="34" height="25" rx="7"/><path class="shackle" d="M22 29V22a10 10 0 0 1 20 0v7"/><circle cx="32" cy="41" r="2.6"/><path d="M32 44v4"/></svg></button></div><div class="pg-lock is-unlocked" style="flex:none;gap:0;width:200px;height:200px;justify-content:center"><button class="pg-lockbtn " style="--hold:1" aria-label="Hold to unlock"><svg class="pg-lockbtn__ring" viewBox="0 0 176 176"><circle class="pg-lockbtn__track" cx="88" cy="88" r="82"/><circle class="pg-lockbtn__prog" cx="88" cy="88" r="82"/></svg><svg class="pg-lockbtn__icon" viewBox="0 0 64 64"><rect x="15" y="29" width="34" height="25" rx="7"/><path class="shackle" d="M22 29V22a10 10 0 0 1 20 0v7"/><circle cx="32" cy="41" r="2.6"/><path d="M32 44v4"/></svg></button></div><div class="pg-lock" id="live" style="flex:none;gap:0;width:200px;height:200px;justify-content:center"><button class="pg-lockbtn" aria-label="Hold to unlock (live)"><svg class="pg-lockbtn__ring" viewBox="0 0 176 176"><circle class="pg-lockbtn__track" cx="88" cy="88" r="82"/><circle class="pg-lockbtn__prog" cx="88" cy="88" r="82"/></svg><svg class="pg-lockbtn__icon" viewBox="0 0 64 64"><rect x="15" y="29" width="34" height="25" rx="7"/><path class="shackle" d="M22 29V22a10 10 0 0 1 20 0v7"/><circle cx="32" cy="41" r="2.6"/><path d="M32 44v4"/></svg></button></div></div><div class="body-sm" style="text-align:center;color:var(--ink-3);margin-top:8px">Right-most: live, hold 4 s</div></div>

var live=document.getElementById('live');var api=PhoneGyro.holdToUnlock(live.querySelector('.pg-lockbtn'),{ms:4000,onDone:function(){setTimeout(function(){api.reset()},1800)}});
</script>
