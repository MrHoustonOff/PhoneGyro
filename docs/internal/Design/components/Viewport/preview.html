<!-- @dsCard group="Data" height=330 subtitle="Orientation viewport with rings floor, and aim bench" -->
<div class="pg-app" style="padding:20px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div class="pg-viewport" style="border-radius:14px;height:270px"><span class="pg-viewport__tag">3/4 VIEW</span><div class="pg-scene"><div class="pg-rings-floor" style="--fx:68deg;--fy:38px"></div><div class="pg-cross"></div><div class="pg-cube" style="--rx:-24deg;--ry:-32deg;--rz:0deg"><div class="pg-cube__f pg-cube__f--front">FRONT</div><div class="pg-cube__f pg-cube__f--back">BACK</div><div class="pg-cube__f pg-cube__f--right">RIGHT</div><div class="pg-cube__f pg-cube__f--left">LEFT</div><div class="pg-cube__f pg-cube__f--top">TOP</div><div class="pg-cube__f pg-cube__f--bottom">BOTTOM</div></div></div></div>
<div class="pg-card" style="height:270px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="display-sm">Zelda-Style Aim Reticle</span><span style="display:flex;gap:8px"><span class="pg-badge pg-badge--info">DSU</span><button class="pg-btn pg-btn--sm">Recenter</button></span></div>
<div class="pg-bench" style="flex:1"><div class="pg-cross" style="opacity:.6"></div><div class="pg-target" style="left:64%;top:16%"></div><div class="pg-bench__readout">X: -0.0° Y: +0.0°</div></div></div></div></div>
