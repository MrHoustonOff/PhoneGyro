<script>

(function(){var box=document.getElementById('lvplay'),flip=1,auto=0,ax=0,ay=0,t0=0;
function L(){var e=box.querySelector('.pg-level3d');return e&&e._pgLevel}
function push(){var l=L();if(!l)return;var z=Math.sqrt(Math.max(0.02,1-ax*ax-ay*ay))*flip;l.setAccel(ax,ay,z)}
function ptr(e){var r=box.getBoundingClientRect();ax=Math.max(-.95,Math.min(.95,((e.clientX-r.left)/r.width-.5)*2.2));ay=Math.max(-.95,Math.min(.95,-((e.clientY-r.top)/r.height-.5)*2.2));auto=0;push()}
box.addEventListener('pointerdown',function(e){box.setPointerCapture(e.pointerId);ptr(e);box.onpointermove=ptr});
box.addEventListener('pointerup',function(){box.onpointermove=null});
document.getElementById('lvflip').onclick=function(){flip*=-1;push()};
document.getElementById('lvreset').onclick=function(){auto=0;flip=1;ax=ay=0;push()};
document.getElementById('lvauto').onclick=function(){auto=1;t0=performance.now();(function tick(){if(!auto)return;var t=(performance.now()-t0)/1000;ax=Math.sin(t*1.1)*.5;ay=Math.cos(t*.8)*.4;flip=Math.sin(t*.45)>.72?-1:1;push();setTimeout(tick,33)})()};
})();
</script>

<button id="pg-theme" class="pg-btn pg-app">Light / Dark</button>
<script>document.getElementById('pg-theme').onclick=function(){PhoneGyro.setTheme(PhoneGyro.theme()==="dark"?"light":"dark")}</script></body></html>
