<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhoneGyro - ScreenConnect</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css">
<style>body{margin:0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;background:var(--bg);padding:0}#pg-theme{position:fixed;right:16px;bottom:64px;z-index:99}</style></head><body>
<script src="../components/bundle.js"></script><div class="pg-app pg-phone pg-drift pg-drift--fast">
<div style="display:flex;justify-content:center;padding-top:20px"><span class="pg-badge pg-badge--ok pg-badge--dot" style="height:30px;font-size:12px;padding:0 14px">Touch Shield on · streaming 62 Hz</span></div>
<div class="pg-lock" id="lock"><div class="pg-lockwrap"><div class="pg-sonar"><i></i><i></i><i></i></div>
<button class="pg-lockbtn" id="btn" aria-label="Hold 4 seconds to unlock"><svg class="pg-lockbtn__ring" viewBox="0 0 176 176"><circle class="pg-lockbtn__track" cx="88" cy="88" r="82"/><circle class="pg-lockbtn__prog" cx="88" cy="88" r="82"/></svg><svg class="pg-lockbtn__icon" viewBox="0 0 64 64"><rect x="15" y="29" width="34" height="25" rx="7"/><path class="shackle" d="M22 29V22a10 10 0 0 1 20 0v7"/><circle cx="32" cy="41" r="2.6"/><path d="M32 44v4"/></svg></button></div>
<div class="pg-lock__text"><div class="pg-lock__count" id="cnt">4.0 s</div><div class="body" id="lab" style="color:var(--ink-2)">Hold to unlock</div><button class="pg-btn pg-btn--ghost" id="again" hidden>Lock again</button></div></div>
<div class="pg-mfoot"><span>PhoneGyro · Controller Client</span><span>LAN Direct</span></div></div>
<script>
var lock=document.getElementById('lock'),btn=document.getElementById('btn'),cnt=document.getElementById('cnt'),lab=document.getElementById('lab'),again=document.getElementById('again'),demo=true;
var api=PhoneGyro.holdToUnlock(btn,{ms:4000,onProgress:function(p,l){cnt.textContent=(l/1000).toFixed(1)+' s'},onDone:function(){cnt.textContent='0.0 s';lab.textContent='Unlocked';again.hidden=false;if(demo)setTimeout(relock,2600)}});
function relock(){api.reset();cnt.textContent='4.0 s';lab.textContent='Hold to unlock';again.hidden=true;if(demo)setTimeout(press,1600)}
function press(){if(demo)btn.dispatchEvent(new Event('pointerdown'))}
again.addEventListener('click',function(){demo=false;relock()});
['pointerdown','keydown'].forEach(function(n){btn.addEventListener(n,function(e){if(e.isTrusted)demo=false})});
setTimeout(press,1600);
</script>

<button id="pg-theme" class="pg-btn pg-app">Light / Dark</button>
<script>document.getElementById('pg-theme').onclick=function(){PhoneGyro.setTheme(PhoneGyro.theme()==="dark"?"light":"dark")}</script></body></html>
