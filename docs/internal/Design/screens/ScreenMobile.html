<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhoneGyro - ScreenConnect</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css">
<style>body{margin:0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;background:var(--bg);padding:0}#pg-theme{position:fixed;right:16px;bottom:64px;z-index:99}</style></head><body>
<script src="../components/bundle.js"></script><div class="pg-app pg-phone"><div class="pg-mbar"><span class="pg-mchip"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>iPhone<span class="pg-mchip__dot"></span></span><div class="pg-mbar__end"><button class="pg-btn-icon pg-btn-icon--round" aria-label="Touch Shield"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.2 8.6-7 10-3.8-1.4-7-5-7-10V6z"/></svg></button><button class="pg-btn-icon pg-btn-icon--round" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg></button><button class="pg-btn-icon pg-btn-icon--round" aria-label="Language">EN</button></div></div>
<div class="pg-mstage"><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div class="pg-level3d" data-ax="0.09" data-ay="0.06" data-az="0.99" data-labels='{"level": "LEVEL", "tilt": "TILT", "steep": "STEEP", "down": "FACE DOWN"}'><div class="pg-dial pg-level3d__fb" style="--bx:10px;--by:6px"><svg viewBox="0 0 264 264"><circle class="guide" cx="132" cy="132" r="92"/><circle class="guide guide--dash" cx="132" cy="132" r="62"/><circle class="guide" cx="132" cy="132" r="34"/><line class="cross" x1="132" y1="40" x2="132" y2="224"/><line class="cross" x1="40" y1="132" x2="224" y2="132"/><line class="tick" x1="187.0" y1="36.7" x2="193.0" y2="26.3"/><line class="tick" x1="227.3" y1="77.0" x2="237.7" y2="71.0"/><line class="tick tick--major" x1="235.0" y1="132.0" x2="254.0" y2="132.0"/><line class="tick" x1="227.3" y1="187.0" x2="237.7" y2="193.0"/><line class="tick" x1="187.0" y1="227.3" x2="193.0" y2="237.7"/><line class="tick tick--major" x1="132.0" y1="235.0" x2="132.0" y2="254.0"/><line class="tick" x1="77.0" y1="227.3" x2="71.0" y2="237.7"/><line class="tick" x1="36.7" y1="187.0" x2="26.3" y2="193.0"/><line class="tick tick--major" x1="29.0" y1="132.0" x2="10.0" y2="132.0"/><line class="tick" x1="36.7" y1="77.0" x2="26.3" y2="71.0"/><line class="tick" x1="77.0" y1="36.7" x2="71.0" y2="26.3"/><path class="level" d="M132 9l7 15h-14z"/></svg><div class="pg-dial__well"></div><div class="pg-dial__bubble"></div></div></div><span class="pg-dial__label">LEVEL</span></div></div>
<button class="pg-pause"><div class="pg-pause__head"><span class="pg-badge pg-badge--ok pg-badge--dot" style="height:26px;font-size:12px">CONNECTED · STREAMING</span><span class="mono" style="color:var(--ink-3)">62 Hz</span></div><div class="pg-pause__title">Pause</div><div class="pg-pause__desc">Tap to temporarily pause motion transmission</div></button>
<div class="pg-mrow"><button class="pg-btn"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>Disconnect</button><button class="pg-btn"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.2 8.6-7 10-3.8-1.4-7-5-7-10V6z"/></svg>Touch Shield</button></div>
<div class="pg-mfoot"><span>PhoneGyro · Controller Client</span><span>LAN Direct</span></div></div>

<button id="pg-theme" class="pg-btn pg-app">Light / Dark</button>
<script>document.getElementById('pg-theme').onclick=function(){PhoneGyro.setTheme(PhoneGyro.theme()==="dark"?"light":"dark")}</script></body></html>
