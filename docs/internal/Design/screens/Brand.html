<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhoneGyro - ScreenConnect</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css">
<style>body{margin:0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;background:var(--bg);padding:0}#pg-theme{position:fixed;right:16px;bottom:64px;z-index:99}</style></head><body>
<script src="../components/bundle.js"></script><div class="pg-app" style="padding:24px;display:flex;flex-direction:column;gap:22px">
<div><div class="pg-overline" style="margin-bottom:10px"><span class="pg-ring"></span>Wordmark: two variants</div>
<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><div><div class="mono-sm" style="color:var(--ink-3);margin-bottom:6px">A · pill, ring-o (default)</div><div style="display:inline-flex"><div class="pg-island pg-brand"><svg class="pg-mark" viewBox="0 0 512 512"><path class="o" d="M60 270A196 66 0 0 1 452 270" transform="rotate(-14 256 270)"/><g transform="rotate(20 256 256)"><rect class="p" x="180" y="92" width="152" height="328" rx="38"/><path class="p" d="M230 134h52"/></g><path class="o" d="M452 270A196 66 0 0 1 60 270" transform="rotate(-14 256 270)"/><path class="a" d="M256 20l38 54h-76z M256 492l-38-54h76z"/></svg><span class="pg-wordmark">PhoneGyr<i class="pg-wordmark__o is-live"></i></span></div></div></div><div><div class="mono-sm" style="color:var(--ink-3);margin-bottom:6px">B · engraved plate</div><div style="display:inline-flex"><div class="pg-island pg-brand pg-brand--plate"><svg class="pg-mark" viewBox="0 0 512 512"><path class="o" d="M60 270A196 66 0 0 1 452 270" transform="rotate(-14 256 270)"/><g transform="rotate(20 256 256)"><rect class="p" x="180" y="92" width="152" height="328" rx="38"/><path class="p" d="M230 134h52"/></g><path class="o" d="M452 270A196 66 0 0 1 60 270" transform="rotate(-14 256 270)"/><path class="a" d="M256 20l38 54h-76z M256 492l-38-54h76z"/></svg><span class="pg-wordmark">PhoneGyr<i class="pg-wordmark__o"></i></span></div></div></div>
<div><div class="mono-sm" style="color:var(--ink-3);margin-bottom:6px">Mark alone (UI glyph)</div><div style="display:flex;gap:12px;align-items:center"><svg class="pg-mark" style="width:16px;height:16px" viewBox="0 0 512 512"><path class="o" d="M60 270A196 66 0 0 1 452 270" transform="rotate(-14 256 270)"/><g transform="rotate(20 256 256)"><rect class="p" x="180" y="92" width="152" height="328" rx="38"/><path class="p" d="M230 134h52"/></g><path class="o" d="M452 270A196 66 0 0 1 60 270" transform="rotate(-14 256 270)"/><path class="a" d="M256 20l38 54h-76z M256 492l-38-54h76z"/></svg><svg class="pg-mark" viewBox="0 0 512 512"><path class="o" d="M60 270A196 66 0 0 1 452 270" transform="rotate(-14 256 270)"/><g transform="rotate(20 256 256)"><rect class="p" x="180" y="92" width="152" height="328" rx="38"/><path class="p" d="M230 134h52"/></g><path class="o" d="M452 270A196 66 0 0 1 60 270" transform="rotate(-14 256 270)"/><path class="a" d="M256 20l38 54h-76z M256 492l-38-54h76z"/></svg><svg class="pg-mark" style="width:56px;height:56px" viewBox="0 0 512 512"><path class="o" d="M60 270A196 66 0 0 1 452 270" transform="rotate(-14 256 270)"/><g transform="rotate(20 256 256)"><rect class="p" x="180" y="92" width="152" height="328" rx="38"/><path class="p" d="M230 134h52"/></g><path class="o" d="M452 270A196 66 0 0 1 60 270" transform="rotate(-14 256 270)"/><path class="a" d="M256 20l38 54h-76z M256 492l-38-54h76z"/></svg></div></div></div></div>
<div><div class="pg-overline" style="margin-bottom:10px"><span class="pg-ring"></span>App icon: three sketches</div>
<div style="display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap"><div style="text-align:center"><img src="../assets/Brand/icon-slate-512.png" width="132" height="132" alt="Slate"><div class="mono-sm" style="color:var(--ink-3)">slate · dark</div></div><div style="text-align:center"><img src="../assets/Brand/icon-paper-512.png" width="132" height="132" alt="Paper"><div class="mono-sm" style="color:var(--ink-3)">light</div></div><div style="text-align:center"><img src="../assets/Brand/icon-orb-512.png" width="132" height="132" alt="Orb"><div class="mono-sm" style="color:var(--ink-3)">orb (also tray)</div></div>
<div style="display:flex;gap:10px;align-items:flex-end"><img src="../assets/Brand/icon-slate-512.png" width="48" height="48" alt=""><img src="../assets/Brand/icon-slate-512.png" width="32" height="32" alt=""><img src="../assets/Brand/icon-slate-512.png" width="16" height="16" alt=""></div></div></div>
<div><div class="pg-overline" style="margin-bottom:10px"><span class="pg-ring"></span>Your logo (cleaned) and tray states</div>
<div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap"><img src="../assets/Brand/logo-mark.png" width="150" height="150" alt="Logo">
<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:10px;background:#202020"><img src="../assets/Brand/tray-online.svg" width="16" height="16" alt=""><img src="../assets/Brand/tray-offline.svg" width="16" height="16" alt=""><img src="../assets/Brand/tray-paused.svg" width="16" height="16" alt=""><span class="mono-sm" style="color:#bbb">on a dark taskbar</span></div>
<div style="display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:10px;background:#f3f3f3"><img src="../assets/Brand/tray-online.svg" width="16" height="16" alt=""><img src="../assets/Brand/tray-offline.svg" width="16" height="16" alt=""><img src="../assets/Brand/tray-paused.svg" width="16" height="16" alt=""><span class="mono-sm" style="color:#555">on a light taskbar</span></div>
<div style="display:flex;gap:12px;align-items:center"><img src="../assets/Brand/tray-online.svg" width="48" height="48" alt=""><img src="../assets/Brand/tray-offline.svg" width="48" height="48" alt=""><img src="../assets/Brand/tray-paused.svg" width="48" height="48" alt=""></div></div></div></div></div>

<button id="pg-theme" class="pg-btn pg-app">Light / Dark</button>
<script>document.getElementById('pg-theme').onclick=function(){PhoneGyro.setTheme(PhoneGyro.theme()==="dark"?"light":"dark")}</script></body></html>
