<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhoneGyro — GyroScene Bench</title>
<link rel="stylesheet" href="/css/pg.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 1.5rem;
    box-sizing: border-box;
  }
  .bench-card {
    width: 100%;
    max-width: 44rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    box-shadow: var(--shadow-md);
  }
  .bench-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .bench-title {
    font-size: 1.125rem;
    font-weight: 600;
  }
  .pg-stage {
    height: 18.75rem; /* 300px */
  }
  .bench-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }
  .bench-logs {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--ink-2);
    min-height: 1.25rem;
  }
</style>
</head>
<body class="pg-app">
  <div class="bench-card">
    <div class="bench-head">
      <div class="bench-title">3D GyroScene Stage Test (~300px)</div>
      <div style="display:flex;gap:0.5rem">
        <button type="button" class="pg-btn pg-btn--sm" id="btn-theme">Toggle Theme</button>
        <button type="button" class="pg-btn pg-btn--sm" id="btn-init">Init Scene</button>
      </div>
    </div>

    <div class="pg-stage" id="stage">
      <span class="pg-viewport__tag">GAMEPAD</span>
      <div class="pg-stage__cap" id="stage-cap">Ready to initialize</div>
    </div>

    <div class="bench-controls">
      <div class="pg-seg" id="seg-step" role="radiogroup">
        <button class="pg-seg__btn is-active" type="button" data-step="rest">Rest</button>
        <button class="pg-seg__btn" type="button" data-step="pitch">Pitch</button>
        <button class="pg-seg__btn" type="button" data-step="roll">Roll</button>
        <button class="pg-seg__btn" type="button" data-step="axes">Axes</button>
        <button class="pg-seg__btn" type="button" data-step="live">Live</button>
      </div>
      <button type="button" class="pg-btn pg-btn--sm" id="btn-rec-05">Rec 50%</button>
      <button type="button" class="pg-btn pg-btn--sm" id="btn-rec-0">Rec 0%</button>
      <button type="button" class="pg-btn pg-btn--sm" id="btn-quat">Quat [0,0,0,1]</button>
    </div>

    <div class="bench-logs" id="bench-log">Status: waiting for init...</div>
  </div>

  <script type="module">
    import { createGyroScene } from '/js/ui/scene.js';

    const CAP = {
      idle: 'Live idle motion',
      rest: 'Place your phone on the table in gaming grip',
      pitch: 'Tilt forward (nod)',
      roll: 'Bank right (roll)',
      axes: 'Twist and tilt the phone together, pausing between moves',
      live: 'Live orientation from sensor'
    };

    let sceneInstance = null;
    const stageEl = document.getElementById('stage');
    const capEl = document.getElementById('stage-cap');
    const logEl = document.getElementById('bench-log');

    window.__benchScene = {
      scene: null,
      init: initScene,
      step: (s) => {
        if (!sceneInstance) return;
        sceneInstance.setStep(s);
        capEl.textContent = CAP[s] || s;
        document.querySelectorAll('#seg-step .pg-seg__btn').forEach(b => {
          b.classList.toggle('is-active', b.dataset.step === s);
        });
      },
      rec: (v) => { if (sceneInstance) sceneInstance.setRecording(v); },
      quat: (q) => { if (sceneInstance) sceneInstance.setQuaternion(q); },
      theme: (t) => {
        if (t) document.documentElement.setAttribute('data-theme', t);
        else {
          const cur = document.documentElement.getAttribute('data-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
        }
      }
    };

    async function initScene() {
      if (sceneInstance) return sceneInstance;
      logEl.textContent = 'Status: loading Three.js and vendor/gyroscene.js...';
      const t0 = performance.now();
      sceneInstance = await createGyroScene(stageEl, { step: 'rest' });
      window.__benchScene.scene = sceneInstance;
      logEl.textContent = 'Status: scene created, waiting for GLB geometry...';
      await sceneInstance.ready;
      const ms = Math.round(performance.now() - t0);
      capEl.textContent = CAP.rest;
      logEl.textContent = `Status: ready with tinted gamepad model in ${ms}ms`;
      return sceneInstance;
    }

    document.getElementById('btn-init').addEventListener('click', initScene);
    document.getElementById('btn-theme').addEventListener('click', () => window.__benchScene.theme());

    document.getElementById('seg-step').addEventListener('click', (e) => {
      const b = e.target.closest('.pg-seg__btn');
      if (!b || !b.dataset.step) return;
      window.__benchScene.step(b.dataset.step);
    });

    document.getElementById('btn-rec-05').addEventListener('click', () => {
      window.__benchScene.rec(0.5);
      logEl.textContent = 'setRecording(0.5) applied';
    });

    document.getElementById('btn-rec-0').addEventListener('click', () => {
      window.__benchScene.rec(0);
      logEl.textContent = 'setRecording(0) applied';
    });

    document.getElementById('btn-quat').addEventListener('click', () => {
      window.__benchScene.quat([0, 0, 0, 1]);
      logEl.textContent = 'setQuaternion([0,0,0,1]) applied';
    });
  </script>
</body>
</html>
