:root,[data-theme="light"]{
  --bg:#f1f1f1;
  --surface:#ffffff;
  --surface-inset:#e8e8e8;
  --surface-hover:#f5f5f5;
  --surface-raised:#ffffff;
  --overlay:rgba(0,0,0,0.45);
  --line:rgba(0,0,0,0.12);
  --line-subtle:rgba(0,0,0,0.07);
  --line-control:rgba(0,0,0,0.48);
  --ink:#0b0b0b;
  --ink-2:#545454;
  --ink-3:#646464;
  --on-ink:#ffffff;
  --ink-hover:#2b2b2b;
  --accent:#5b7c26;
  --on-accent:#ffffff;
  --accent-text:#4a651d;
  --accent-soft:rgba(91,124,38,0.13);
  --accent-line:rgba(91,124,38,0.40);
  --info:#3f7583;
  --info-text:#2f5f6d;
  --info-soft:rgba(63,117,131,0.12);
  --info-line:rgba(63,117,131,0.38);
  --danger:#c2432f;
  --on-danger:#ffffff;
  --danger-text:#b03a27;
  --danger-soft:rgba(194,67,47,0.10);
  --danger-line:rgba(194,67,47,0.38);
  --warn:#b07c0c;
  --warn-text:#7d5500;
  --warn-soft:rgba(176,124,12,0.12);
  --warn-line:rgba(176,124,12,0.40);
  --shadow-card:0 1px 2px rgba(0,0,0,0.05),0 8px 24px rgba(0,0,0,0.06);
  --shadow-pop:0 2px 6px rgba(0,0,0,0.08),0 24px 60px rgba(0,0,0,0.22);
  --shadow-inset:inset 0 1px 2px rgba(0,0,0,0.10);
  --shadow-key:0 1px 0 rgba(0,0,0,0.14);
  --tex-grain:url(img/grain-light.png);
  --tex-rings:var(--tex-rings-light, url(img/rings-light.svg));
  --tb-scale:1;
  --pg-tb:calc(32px * var(--tb-scale));
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --radius-xl:22px;
  --radius-pill:9999px;
  --font-display:"Alegreya Sans", "Onest", system-ui, sans-serif;
  --font-sans:"Onest", system-ui, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}

[data-theme="dark"]{
  --bg:#0b0b0b;
  --surface:#151515;
  --surface-inset:#0a0a0a;
  --surface-hover:#1e1e1e;
  --surface-raised:#1a1a1a;
  --overlay:rgba(0,0,0,0.65);
  --line:rgba(255,255,255,0.12);
  --line-subtle:rgba(255,255,255,0.07);
  --line-control:rgba(255,255,255,0.46);
  --ink:#f4f4f4;
  --ink-2:#a6a6a6;
  --ink-3:#8c8c8c;
  --on-ink:#0b0b0b;
  --ink-hover:#dcdcdc;
  --accent:#a3bc69;
  --on-accent:#0b0b0b;
  --accent-text:#a3bc69;
  --accent-soft:rgba(163,188,105,0.15);
  --accent-line:rgba(163,188,105,0.42);
  --info:#87aab5;
  --info-text:#9dbfca;
  --info-soft:rgba(135,170,181,0.14);
  --info-line:rgba(135,170,181,0.40);
  --danger:#f29b88;
  --on-danger:#0b0b0b;
  --danger-text:#f5a999;
  --danger-soft:rgba(242,155,136,0.14);
  --danger-line:rgba(242,155,136,0.40);
  --warn:#f2cc85;
  --warn-text:#f2cc85;
  --warn-soft:rgba(242,204,133,0.13);
  --warn-line:rgba(242,204,133,0.40);
  --shadow-card:inset 0 1px 0 rgba(255,255,255,0.05),0 8px 28px rgba(0,0,0,0.55);
  --shadow-pop:inset 0 1px 0 rgba(255,255,255,0.06),0 24px 70px rgba(0,0,0,0.75);
  --shadow-inset:inset 0 1px 3px rgba(0,0,0,0.75);
  --shadow-key:0 1px 0 rgba(0,0,0,0.9);
  --tex-grain:url(img/grain-dark.png);
  --tex-rings:var(--tex-rings-dark, url(img/rings-dark.svg));
}

*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background-color:var(--bg);color:var(--ink);user-select:none;-webkit-user-select:none;font-family:var(--font-sans)}

/* Application root shell */
#pg-root{width:100%;height:100%;position:relative;overflow:hidden;background-color:var(--bg)}
.pg-shell{--pg-hh:56px;--pg-fh:44px;position:relative}

/* Optimized drifting Hyrule rings texture (GPU compositor thread, will-change: transform) */
.pg-drift{position:relative;overflow:hidden}
.pg-drift::before{
  content:"";
  position:absolute;
  inset:-600px;
  z-index:0;
  pointer-events:none;
  background-image:var(--tex-rings);
  background-size:600px 600px;
  animation:pg-drift 192s linear infinite;
  will-change:transform;
}
.pg-drift>*{position:relative;z-index:1}
@keyframes pg-drift{to{transform:translate3d(600px,600px,0)}}
@media (prefers-reduced-motion:reduce){.pg-drift::before{animation:none}}

/* Vector glyph mark (gyro phone with orbit ring) */
.pg-mark{width:28px;height:28px;flex:none}
.pg-mark .o{fill:none;stroke:var(--accent);stroke-width:26;stroke-linecap:round}
.pg-mark .p{fill:none;stroke:var(--ink);stroke-width:26;stroke-linecap:round}
.pg-mark .a{fill:var(--accent)}
/* Custom title bar (design: TitleBar) */
.pg-titlebar{position:absolute;left:0;right:0;top:0;height:var(--pg-tb);z-index:4;display:flex;align-items:center;
  justify-content:space-between;padding:0 calc(8px * var(--tb-scale)) 0 calc(14px * var(--tb-scale));
  -webkit-app-region:drag;--wails-draggable:drag;user-select:none}
.pg-titlebar__title{display:flex;align-items:center;gap:calc(8px * var(--tb-scale));
  font:600 calc(12px * var(--tb-scale))/1 var(--font-sans);color:var(--ink-2)}
.pg-titlebar__title .pg-mark{width:calc(16px * var(--tb-scale));height:calc(16px * var(--tb-scale))}
.pg-titlebar__ver{font:400 calc(11px * var(--tb-scale))/1 var(--font-mono);color:var(--ink-3)}
.pg-titlebar__ctl{display:flex;align-items:center;gap:calc(2px * var(--tb-scale));
  height:calc(26px * var(--tb-scale));padding:calc(2px * var(--tb-scale));border-radius:9999px;
  background:var(--surface) var(--tex-grain);border:1px solid var(--line);box-shadow:var(--shadow-card);
  -webkit-app-region:no-drag;--wails-draggable:no-drag}
.pg-wc{display:inline-flex;align-items:center;justify-content:center;
  width:calc(34px * var(--tb-scale));height:calc(20px * var(--tb-scale));padding:0;border:0;
  border-radius:9999px;background:transparent;color:var(--ink-2);cursor:pointer;transition:background .12s,color .12s}
.pg-wc:hover{background:var(--surface-hover);color:var(--ink)}
.pg-wc--close:hover{background:var(--danger);color:var(--on-danger)}
.pg-wc svg{width:calc(11px * var(--tb-scale));height:calc(11px * var(--tb-scale));
  stroke:currentColor;fill:none;stroke-width:calc(1.6 * var(--tb-scale));stroke-linecap:round;stroke-linejoin:round}
.pg-wc .restore,.is-max .pg-wc .max{display:none}
.is-max .pg-wc .restore{display:block}
.pg-titlebar.is-blur .pg-titlebar__title,.pg-titlebar.is-blur .pg-titlebar__ctl{opacity:.55}

/* Shell v2 floating header and footer */
.pg-header{position:absolute;left:0;right:0;top:var(--pg-tb);z-index:3;display:flex;align-items:center;justify-content:space-between;padding:8px var(--space-4);pointer-events:none}
.pg-header>*{pointer-events:auto}
.pg-footer{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;justify-content:flex-end;padding:6px var(--space-4) 8px;pointer-events:none}
.pg-footer>*{pointer-events:auto}

/* Floating islands */
.pg-island{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:var(--space-1);height:38px;padding:0 4px;border-radius:var(--radius-pill);background:var(--surface) var(--tex-grain);border:1px solid var(--line);box-shadow:var(--shadow-card);color:var(--ink);text-decoration:none}
.pg-island--sm{height:32px;padding:0 12px;gap:var(--space-2);font:400 12px/1 var(--font-mono);color:var(--ink-2)}
.pg-island--sm b{font-weight:600;color:var(--ink);font-size:12px}
.pg-island__sep{width:1px;height:14px;background:var(--line);margin:0 2px;flex:none}
a.pg-island:hover,button.pg-island:hover{background:var(--surface-hover) var(--tex-grain)}

/* Navigation tabs inside header island */
.pg-tab{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:var(--space-2);height:32px;padding:0 12px;border-radius:var(--radius-pill);border:1px solid transparent;background:transparent;color:var(--ink);font:600 14px/20px var(--font-sans);cursor:pointer;box-shadow:none;transition:background .15s,color .15s,border-color .15s}
.pg-tab:hover{background:var(--surface-hover)}
.pg-tab.is-active{background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface);border-color:var(--accent-line);color:var(--accent-text)}
.pg-tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Button icon inside island */
.pg-btn-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s}
.pg-btn-icon:hover{background:var(--surface-hover);color:var(--ink)}
.pg-btn-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Segmented control inside island */
.pg-seg{display:inline-flex;align-items:center;gap:2px;height:32px;padding:2px;border-radius:var(--radius-pill);background:var(--surface-inset);box-shadow:var(--shadow-inset)}
.pg-seg__btn{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 10px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--ink-2);font:600 12px/1 var(--font-mono);cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
.pg-seg__btn:hover{color:var(--ink)}
.pg-seg__btn.is-active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-key),0 0 0 1px var(--line)}

/* Status capsule */
.pg-status{display:inline-flex;align-items:center;gap:var(--space-2);height:32px;padding:0 10px 0 6px;border:0;background:transparent;font:400 12px/1 var(--font-mono);letter-spacing:.02em;text-transform:lowercase;color:var(--ink)}
.pg-status__dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}
.pg-status__dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid currentColor;color:var(--danger);opacity:.5}
.pg-status--online .pg-status__dot{background:var(--accent)}
.pg-status--online .pg-status__dot::after{color:var(--accent);animation:pg-ping 2.2s ease-out infinite}
.pg-status--paused .pg-status__dot{background:var(--warn)}
.pg-status--paused .pg-status__dot::after{color:var(--warn)}
@keyframes pg-ping{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.7);opacity:0}}

/* Badges */
.pg-badge{display:inline-flex;align-items:center;gap:var(--space-1);height:16px;padding:0 6px;border-radius:var(--radius-pill);border:1px solid var(--line);background:var(--surface-inset);color:var(--ink-2);font:600 10px/1 var(--font-mono);letter-spacing:.02em;white-space:nowrap}
.pg-badge--ok{background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface);border-color:var(--accent-line);color:var(--accent-text)}
.pg-badge--warn{background:linear-gradient(var(--warn-soft),var(--warn-soft)),var(--surface);border-color:var(--warn-line);color:var(--warn-text)}

/* Repo link in footer */
.pg-f-repo{text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,transform .12s}
.pg-f-repo:hover{transform:translateY(-1px)}
.pg-f-repo:active{transform:translateY(0)}
.pg-f-repo svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pg-f-repo__n{font-family:var(--font-sans);font-weight:500;font-size:12px;color:var(--ink-2)}
.pg-f-repo:hover .pg-f-repo__n{color:var(--ink)}
.pg-dim{color:var(--ink-3)}

/* Window body under title bar and header */
.pg-shell__body{position:absolute;inset:0;padding:calc(var(--pg-tb) + var(--pg-hh)) 0 var(--pg-fh);box-sizing:border-box;overflow:hidden}

/* Temporary stub view for unreleased pages */
.pg-stub{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;background:var(--overlay);backdrop-filter:blur(3px);padding:var(--space-4)}
.pg-stub[hidden]{display:none!important}
.pg-stub__card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 32px;border-radius:var(--radius-xl);background:var(--surface) var(--tex-grain);border:1px solid var(--line);box-shadow:var(--shadow-pop);text-align:center;max-width:380px}
.pg-stub__title{font:700 20px/24px var(--font-display);color:var(--ink)}
.pg-stub__desc{font:400 13px/18px var(--font-sans);color:var(--ink-2)}
.pg-stub__close{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 20px;border-radius:var(--radius-pill);border:1px solid var(--line);background:var(--surface-inset);color:var(--ink);font:600 13px/1 var(--font-sans);cursor:pointer;transition:background .15s}
.pg-stub__close:hover{background:var(--surface-hover)}
</style>
<script src="js/zelda-rings.js"></script>
<script>
(() => {
  if (typeof ZeldaRings === 'undefined') return;
  const base = {
    circleCount: 30, minRadius: 50, maxRadius: 220, ringGap: 16, strokeWidth: 6,
    lineGap: 16, amplitude: 5, halfWave: 60, padding: 8, precision: 0, sortBySize: true, center: 'dot'
  };
  const seed = (Math.random() * 2147483647) >>> 0;
  try {
    const lightSvg = ZeldaRings.generate({ ...base, seed, background: '#F1F1F1', stroke: '#E7E7E7' });
    const darkSvg = ZeldaRings.generate({ ...base, seed, background: '#0B0B0B', stroke: '#191919' });
    const root = document.documentElement;
    root.style.setProperty('--tex-rings-light', `url("${ZeldaRings.toBlobURL(lightSvg)}")`);
    root.style.setProperty('--tex-rings-dark', `url("${ZeldaRings.toBlobURL(darkSvg)}")`);
  } catch (e) {
    console.error('Failed to generate procedural pattern:', e);
  }
})();
</script>
</head>
<body>
<div class="pg-app pg-shell pg-window has-titlebar pg-drift" id="pg-root">
  <!-- Frameless Title Bar -->
  <header class="pg-titlebar" id="titlebar">
    <div class="pg-titlebar__title">
      <svg class="pg-mark" viewBox="0 0 512 512" aria-hidden="true">
        <path class="o" d="M60 270A196 66 0 0 1 452 270" transform="rotate(-14 256 270)"/>
        <g transform="rotate(20 256 256)"><rect class="p" x="180" y="92" width="152" height="328" rx="38"/><path class="p" d="M230 134h52"/></g>
        <path class="o" d="M452 270A196 66 0 0 1 60 270" transform="rotate(-14 256 270)"/>
        <path class="a" d="M256 20l38 54h-76z M256 492l-38-54h76z"/>
      </svg>
      <span>PhoneGyro</span>
      <span class="pg-titlebar__ver" id="ver"></span>
    </div>
    <div class="pg-titlebar__ctl">
      <button class="pg-wc" id="wc-min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button class="pg-wc" id="wc-max" aria-label="Maximize"><svg class="max" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.4"/></svg><svg class="restore" viewBox="0 0 12 12"><rect x="2" y="3.6" width="6.4" height="6.4" rx="1.2"/><path d="M4 3.6V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-.6"/></svg></button>
      <button class="pg-wc pg-wc--close" id="wc-close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </header>

  <!-- Shell Floating Header: Left Navigation + Right Controls -->
  <header class="pg-header pg-header--two" id="shell-header">
    <nav class="pg-island" id="nav-tabs" aria-label="Main Navigation">
      <button class="pg-tab" id="nav-settings" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span class="pg-tab__l" data-i18n="nav.settings">Настройки</span>
      </button>
      <button class="pg-tab" id="nav-stats" type="button">
        <svg viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>
        <span class="pg-tab__l" data-i18n="nav.stats">Статистика &amp; 3D</span>
      </button>
      <button class="pg-tab" id="nav-docs" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20"/></svg>
        <span class="pg-tab__l" data-i18n="nav.docs">Документация</span>
      </button>
    </nav>

    <div class="pg-island">
      <button class="pg-btn-icon" id="btn-theme" aria-label="Theme" title="Сменить тему" type="button">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>
      </button>
      <div class="pg-seg" id="seg-lang" role="radiogroup" aria-label="Language">
        <button class="pg-seg__btn is-active" id="lang-ru" type="button" role="radio" aria-checked="true">RU</button>
        <button class="pg-seg__btn" id="lang-en" type="button" role="radio" aria-checked="false">EN</button>
      </div>
      <span class="pg-status" id="conn-status">
        <span class="pg-status__dot"></span>
        <span class="pg-status__t" id="conn-status-text">офлайн</span>
      </span>
    </div>
  </header>

  <!-- Central workspace container -->
  <main class="pg-shell__body">
    <!-- Stub view for tabs -->
    <div id="pg-stub" hidden class="pg-stub">
      <div class="pg-stub__card">
        <div class="pg-stub__title" id="pg-stub-title">Раздел в разработке</div>
        <div class="pg-stub__desc" id="pg-stub-desc">Этот экран будет подключен на следующем этапе разработки.</div>
        <button class="pg-stub__close" id="pg-stub-close" type="button">Закрыть</button>
      </div>
    </div>
  </main>

  <!-- Floating Footer (Bottom Right Repo + Version) -->
  <footer class="pg-footer">
    <a class="pg-island pg-island--sm pg-f-repo" id="repo-link" href="https://github.com/MrHoustonOff/PhoneGyro" target="_blank" rel="noopener" title="Открыть репозиторий GitHub">
      <span class="pg-dim" id="footer-ver">2.0.0.116</span>
      <span class="pg-badge pg-badge--warn" id="footer-badge">DEV</span>
      <span class="pg-island__sep"></span>
      <span style="display:inline-flex;width:14px;height:14px">
        <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      </span>
      <span class="pg-f-repo__n">MrHoustonOff/PhoneGyro</span>
    </a>
  </footer>
</div>

<script>
(() => {
  const rt = window.runtime, app = window.go && window.go.app && window.go.app.App;
  if (!rt || !app) return; // opened outside the app (e.g. a plain browser)
  const bar = document.getElementById('titlebar');

  // ── 1. Window controls & title bar ───────────────────────
  const syncMax = () => rt.WindowIsMaximised().then((m) => bar.classList.toggle('is-max', m));

  document.getElementById('wc-min').onclick = () => rt.WindowMinimise();
  document.getElementById('wc-max').onclick = () => { rt.WindowToggleMaximise(); setTimeout(syncMax, 30); };
  document.getElementById('wc-close').onclick = () => app.CloseWindow();
  bar.addEventListener('dblclick', (e) => {
    if (!e.target.closest('.pg-titlebar__ctl')) {
      rt.WindowToggleMaximise();
      setTimeout(syncMax, 30);
    }
  });

  let t = 0;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(syncMax, 60); });
  syncMax();

  addEventListener('blur', () => bar.classList.add('is-blur'));
  addEventListener('focus', () => bar.classList.remove('is-blur'));

  // ── 2. Theme synchronization ─────────────────────────────
  const setTheme = (theme) => {
    document.documentElement.setAttribute('data-theme', theme);
    if (app.SetTheme) app.SetTheme(theme);
  };

  document.getElementById('btn-theme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    setTheme(cur === 'dark' ? 'light' : 'dark');
  };

  if (app.GetTheme) {
    app.GetTheme().then(theme => {
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    }).catch(() => {});
  }
  if (rt.EventsOn) {
    rt.EventsOn('theme-sync', theme => {
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    });
    rt.EventsOn('theme:changed', theme => {
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    });
  }

  // ── 3. Localization & language switcher ──────────────────
  const I18N = {
    ru: {
      'nav.settings': 'Настройки',
      'nav.stats': 'Статистика & 3D',
      'nav.docs': 'Документация',
      'status.offline': 'офлайн',
      'status.online': 'онлайн',
      'status.paused': 'пауза',
      'stub.title': 'Раздел в разработке',
      'stub.desc': 'Этот экран будет подключен на следующем этапе разработки.',
      'stub.close': 'Закрыть',
    },
    en: {
      'nav.settings': 'Settings',
      'nav.stats': 'Stats & 3D View',
      'nav.docs': 'Docs',
      'status.offline': 'offline',
      'status.online': 'online',
      'status.paused': 'paused',
      'stub.title': 'Under Development',
      'stub.desc': 'This screen will be connected in the next development stage.',
      'stub.close': 'Close',
    }
  };

  let currentLang = 'ru';
  let currentStatus = 'offline';

  const applyLang = (lang) => {
    currentLang = lang === 'en' ? 'en' : 'ru';
    document.documentElement.lang = currentLang;
    const btnRu = document.getElementById('lang-ru');
    const btnEn = document.getElementById('lang-en');
    btnRu.classList.toggle('is-active', currentLang === 'ru');
    btnEn.classList.toggle('is-active', currentLang === 'en');
    btnRu.setAttribute('aria-checked', String(currentLang === 'ru'));
    btnEn.setAttribute('aria-checked', String(currentLang === 'en'));

    const dict = I18N[currentLang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });

    const statusEl = document.getElementById('conn-status-text');
    if (statusEl) {
      statusEl.textContent = dict['status.' + currentStatus] || currentStatus;
    }
    const stubDesc = document.getElementById('pg-stub-desc');
    const stubClose = document.getElementById('pg-stub-close');
    if (stubDesc) stubDesc.textContent = dict['stub.desc'];
    if (stubClose) stubClose.textContent = dict['stub.close'];
  };

  const setLang = (lang) => {
    applyLang(lang);
    if (app.SetLang) app.SetLang(lang);
  };

  document.getElementById('lang-ru').onclick = () => setLang('ru');
  document.getElementById('lang-en').onclick = () => setLang('en');

  if (app.GetLang) {
    app.GetLang().then(lang => {
      if (lang) applyLang(lang);
    }).catch(() => {});
  }
  if (rt.EventsOn) {
    rt.EventsOn('lang-sync', lang => {
      if (lang) applyLang(lang);
    });
  }

  // ── 4. Connection status indicator ───────────────────────
  const setStatus = (status) => {
    currentStatus = status || 'offline';
    const wrap = document.getElementById('conn-status');
    const text = document.getElementById('conn-status-text');
    wrap.className = 'pg-status';
    if (currentStatus === 'online') {
      wrap.classList.add('pg-status--online');
    } else if (currentStatus === 'paused') {
      wrap.classList.add('pg-status--paused');
    }
    const dict = I18N[currentLang] || I18N.ru;
    text.textContent = dict['status.' + currentStatus] || currentStatus;
  };

  if (app.GetState) {
    app.GetState().then(st => {
      if (st && st.status) setStatus(st.status);
    }).catch(() => {});
  }
  if (rt.EventsOn) {
    rt.EventsOn('state:change', st => {
      if (st && st.status) setStatus(st.status);
    });
  }

  // ── 5. Navigation tabs & stub view ───────────────────────
  const stub = document.getElementById('pg-stub');
  const stubTitle = document.getElementById('pg-stub-title');
  const stubClose = document.getElementById('pg-stub-close');
  const tabIds = ['nav-settings', 'nav-stats', 'nav-docs'];
  let activeTab = null;

  const closeStub = () => {
    stub.hidden = true;
    tabIds.forEach(id => document.getElementById(id).classList.remove('is-active'));
    activeTab = null;
  };

  tabIds.forEach(id => {
    const btn = document.getElementById(id);
    btn.onclick = () => {
      if (activeTab === id) {
        closeStub();
        return;
      }
      tabIds.forEach(otherId => document.getElementById(otherId).classList.remove('is-active'));
      btn.classList.add('is-active');
      activeTab = id;
      const label = btn.querySelector('.pg-tab__l').textContent;
      const dict = I18N[currentLang] || I18N.ru;
      stubTitle.textContent = `${label} — ${dict['stub.title']}`;
      stub.hidden = false;
    };
  });

  stubClose.onclick = closeStub;

  // ── 6. Bottom-right GitHub link & version sync ───────────
  document.getElementById('repo-link').onclick = (e) => {
    e.preventDefault();
    if (rt && rt.BrowserOpenURL) {
      rt.BrowserOpenURL('https://github.com/MrHoustonOff/PhoneGyro');
    } else {
      window.open('https://github.com/MrHoustonOff/PhoneGyro', '_blank');
    }
  };

  if (app.GetAppVersion) {
    app.GetAppVersion().then(v => {
      const verStr = v.release + '.' + v.build;
      document.getElementById('ver').textContent = verStr;
      document.getElementById('footer-ver').textContent = verStr;
      const badge = document.getElementById('footer-badge');
      if (badge) {
        const ch = (v.channel || 'dev').toUpperCase();
        badge.textContent = ch;
        badge.className = 'pg-badge ' + (ch === 'RELEASE' ? 'pg-badge--ok' : 'pg-badge--warn');
      }
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
