:root{
  --bg:#f1f1f1;
  --surface:#fff;
  --surface-hover:#f5f5f5;
  --ink:#0b0b0b;
  --ink-2:#545454;
  --ink-3:#646464;
  --accent-text:#4a651d;
  --danger:#c2432f;
  --on-danger:#fff;
  --line:rgba(0,0,0,.12);
  --shadow-card:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  --tex-grain:url(img/grain-light.webp);
  --tb-scale:1.3;
  --pg-tb:calc(32px * var(--tb-scale));
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none}

/* Custom title bar (design: TitleBar, parametric scaling via --tb-scale) */
.pg-titlebar{position:fixed;inset:0 0 auto;height:var(--pg-tb);z-index:4;display:flex;align-items:center;
  justify-content:space-between;padding:0 calc(8px * var(--tb-scale)) 0 calc(14px * var(--tb-scale));
  -webkit-app-region:drag;--wails-draggable:drag;user-select:none}
.pg-titlebar__title{display:flex;align-items:center;gap:calc(8px * var(--tb-scale));
  font:600 calc(12px * var(--tb-scale))/1 "PG Title",sans-serif;color:var(--ink-2)}
.pg-titlebar__title .logo{width:calc(16px * var(--tb-scale));height:calc(16px * var(--tb-scale))}
.pg-titlebar__ver{font:400 calc(11px * var(--tb-scale))/1 "PG Digits",monospace;color:var(--ink-3)}
.pg-titlebar__ctl{display:flex;align-items:center;gap:calc(2px * var(--tb-scale));
  height:calc(26px * var(--tb-scale));padding:calc(2px * var(--tb-scale));border-radius:9999px;
  background:var(--surface) var(--tex-grain);border:1px solid var(--line);box-shadow:var(--shadow-card);
  -webkit-app-region:no-drag;--wails-draggable:no-drag}
.pg-wc{display:inline-flex;align-items:center;justify-content:center;
  width:calc(34px * var(--tb-scale));height:calc(20px * var(--tb-scale));padding:0;border:0;
  border-radius:9999px;background:transparent;color:var(--ink-2);cursor:pointer;transition:background .12s,color .12s}
.pg-wc:hover{background:var(--surface-hover);color:var(--ink)}
.pg-wc--close:hover{background:var(--danger);color:var(--on-danger)}
.pg-wc svg{width:calc(11px * var(--tb-scale));height:calc(11px * var(--tb-scale));
  stroke:currentColor;fill:none;stroke-width:calc(1.6 * var(--tb-scale));stroke-linecap:round;stroke-linejoin:round}
.pg-wc .restore,.is-max .pg-wc .max{display:none}
.is-max .pg-wc .restore{display:block}
.pg-titlebar.is-blur .pg-titlebar__title,.pg-titlebar.is-blur .pg-titlebar__ctl{opacity:.55}

/* Window body under the title bar. */
main{height:100%;padding-top:var(--pg-tb);display:grid;place-items:center}


/* Brand pill (design: pg-island pg-brand, wordmark A). */
.brand{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px 0 8px;
  border:1px solid var(--line);border-radius:9999px;background:var(--surface) var(--tex-grain);box-shadow:var(--shadow-card);
  font:800 22px/1 "PG Wordmark",sans-serif;letter-spacing:.005em;white-space:nowrap}
.brand .logo{width:28px;height:28px}
.word{display:inline-flex;align-items:baseline}
/* The "o" of "Gyro" is a dot in a ring. */
.ring{position:relative;display:inline-block;width:.66em;height:.66em;margin-left:.03em;
  border:.115em solid var(--accent-text);border-radius:50%;align-self:center;transform:translateY(.06em)}
.ring::after{content:"";position:absolute;inset:.1em;border-radius:50%;background:var(--accent-text)}
</style>
</head>
<body>
<header class="pg-titlebar" id="titlebar">
  <div class="pg-titlebar__title"><i class="logo"></i><span>PhoneGyro</span><span class="pg-titlebar__ver" id="ver"></span></div>
  <div class="pg-titlebar__ctl">
    <button class="pg-wc" id="wc-min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
    <button class="pg-wc" id="wc-max" aria-label="Maximize"><svg class="max" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.4"/></svg><svg class="restore" viewBox="0 0 12 12"><rect x="2" y="3.6" width="6.4" height="6.4" rx="1.2"/><path d="M4 3.6V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-.6"/></svg></button>
    <button class="pg-wc pg-wc--close" id="wc-close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
  </div>
</header>
<main>
  <div class="brand" role="img" aria-label="PhoneGyro"><i class="logo"></i><span class="word" aria-hidden="true">PhoneGyr<i class="ring"></i></span></div>
</main>
<script>
(() => {
  const rt = window.runtime, app = window.go && window.go.app && window.go.app.App;
  if (!rt || !app) return; // opened outside the app (e.g. a plain browser)
  const bar = document.getElementById('titlebar');

  const syncMax = () => rt.WindowIsMaximised().then((m) => bar.classList.toggle('is-max', m));

  document.getElementById('wc-min').onclick = () => rt.WindowMinimise();
  document.getElementById('wc-max').onclick = () => { rt.WindowToggleMaximise(); setTimeout(syncMax, 30); };
  document.getElementById('wc-close').onclick = () => app.CloseWindow(); // the "action on window close"
  // Double-click on the strip (not on the buttons) maximizes, like a native caption.
  bar.addEventListener('dblclick', (e) => {
    if (!e.target.closest('.pg-titlebar__ctl')) {
      rt.WindowToggleMaximise();
      setTimeout(syncMax, 30);
    }
  });

  // Maximize/restore icon: sync on resize as well
  let t = 0;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(syncMax, 60); });
  syncMax();

  addEventListener('blur', () => bar.classList.add('is-blur'));
  addEventListener('focus', () => bar.classList.remove('is-blur'));

  app.GetAppVersion().then((v) => { document.getElementById('ver').textContent = v.release + '.' + v.build; });
})();
</script>
</body>
</html>
