:root{
  --bg:#f1f1f1;
  --surface:#fff;
  --ink:#0b0b0b;
  --accent-text:#4a651d;
  --line:rgba(0,0,0,.12);
  --shadow-card:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
}

html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:var(--bg);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none}

/* Brand pill: the design system's pg-island pg-brand (wordmark A), with our own
   logo (docs/internal/Design/assets/Brand/logo-mark) as the mark for now. */
.brand{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px 0 8px;box-sizing:border-box;
  border:1px solid var(--line);border-radius:9999px;background:var(--surface);box-shadow:var(--shadow-card);
  font:800 22px/1 "PG Wordmark",sans-serif;letter-spacing:.005em;white-space:nowrap}
.mark{width:28px;height:28px;flex:none;display:block}
.word{display:inline-flex;align-items:baseline}
/* The "o" of "Gyro" is a dot in a ring. */
.ring{position:relative;display:inline-block;width:.66em;height:.66em;margin-left:.03em;box-sizing:border-box;
  border:.115em solid var(--accent-text);border-radius:50%;align-self:center;transform:translateY(.06em)}
.ring::after{content:"";position:absolute;inset:.1em;border-radius:50%;background:var(--accent-text)}
</style>
