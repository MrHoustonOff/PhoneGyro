<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PhoneGyro</title>
<script>
  // First paint: theme and "play the launch animation" from the last run, so
  // nothing flips once the backend answers (js/main.js keeps them in sync).
  (function () {
    var d = document.documentElement, t = null, s = null;
    try { t = localStorage.getItem('pg-theme'); s = localStorage.getItem('pg-splash'); } catch (e) {}
    if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
    if (s !== '0' && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) d.classList.add('is-splash');
  })();
</script>
<link rel="preload" href="fonts/Onest-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Onest-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/AlegreyaSans-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/pg.css">
<link rel="stylesheet" href="css/app.css">
<!-- A new ring pattern every launch (sets --tex-rings-gen-*; the design tile is the fallback). -->
<script src="js/zelda-rings.js"></script>
<script src="js/rings.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body class="pg-app">
<div class="pg-app pg-shell pg-window has-titlebar pg-drift" id="shell">

  <!-- ───────── Title bar (design: TitleBar) ───────── -->
  <div class="pg-titlebar" id="titlebar">
    <div class="pg-titlebar__title"><img class="app-logo" src="img/logo.webp" alt="" width="16" height="16"><span>PhoneGyro</span><span class="pg-titlebar__ver" id="tb-ver"></span></div>
    <div class="pg-titlebar__ctl">
      <button class="pg-wc" id="wc-min" type="button" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button class="pg-wc" id="wc-max" type="button" aria-label="Maximize"><svg class="wc-max" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.4"/></svg><svg class="wc-restore" viewBox="0 0 12 12"><rect x="2" y="3.6" width="6.4" height="6.4" rx="1.2"/><path d="M4 3.6V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-.6"/></svg></button>
      <button class="pg-wc pg-wc--close" id="wc-close" type="button" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </div>

  <!-- ───────── Screens: scroll under the floating header and footer ───────── -->
  <div class="pg-shell__body" id="body">

    <!-- Connect: phone pairing, USB waiting, or the live device dashboard -->
    <main class="pg-page pg-page--center app-screen" id="screen-connect">
      <div class="pg-seg" id="mode-seg" role="radiogroup">
        <button class="pg-seg__btn is-active" type="button" role="radio" data-mode="phone"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><span data-i18n="mode.phone">Смартфон</span></button>
        <button class="pg-seg__btn" type="button" role="radio" data-mode="usb"><svg viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="10" rx="5"/><path d="M8 10.5v4M6 12.5h4M16 11.5h.01M18 13.5h.01"/></svg><span data-i18n="mode.usb">USB-контроллер</span></button>
      </div>

      <!-- Phone, not connected: pairing -->
      <section class="pg-card pg-card--hero pg-rings-corner pg-conn app-view" id="view-pair">
        <div class="display-lg" data-i18n="ui.scan_title">Отсканируйте камерой телефона</div>
        <div class="body app-sub" data-i18n="ui.scan_sub"></div>
        <div class="pg-qr"><img id="pair-qr" class="app-qr" width="176" height="176" alt=""></div>
        <div class="pg-url"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="pg-url__text" id="pair-url">…</span><button class="pg-btn pg-btn--sm" type="button" data-copy="pair-url" data-i18n="qr.copy">Копировать</button></div>
        <div class="app-dsu-slot" data-dsu-slot="pair"></div>
        <button class="pg-btn pg-btn--primary pg-btn--lg app-wide" id="btn-setup" type="button" data-i18n="nav.setup">Начальная настройка</button>
      </section>

      <!-- USB mode, no controller yet -->
      <section class="pg-card pg-card--hero pg-rings-corner pg-conn app-view" id="view-usbwait" hidden>
        <div class="pg-dev__chip app-chip-lg"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx=".8"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg></div>
        <div class="display-lg" data-i18n="usb_mode.title">Ожидание IMU-датчика</div>
        <div class="body app-sub" data-i18n="usb_mode.desc"></div>
        <span class="pg-badge pg-badge--info pg-badge--dot app-scan" data-i18n="usb_mode.status_scanning">Поиск USB IMU-устройства...</span>
        <div class="app-dsu-slot" data-dsu-slot="usbwait"></div>
        <button class="pg-btn" type="button" id="btn-usb-repo"><svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg><span data-i18n="usb_mode.repo_btn">Репозиторий проекта</span></button>
      </section>

      <!-- A device is streaming (phone or USB): design ScreenUsb, shared by both -->
      <div class="pg-usb app-view" id="view-dash" hidden>
        <div class="pg-usb__col">
          <section class="pg-card pg-card--hero pg-rings-corner app-devcard">
            <div class="pg-dev">
              <div class="pg-dev__chip" id="dev-chip">
                <svg class="app-ico-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
                <svg class="app-ico-usb" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx=".8"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg>
              </div>
              <div class="app-grow">
                <div class="pg-dev__name" id="dev-name">—</div>
                <div class="pg-dev__meta"><span class="pg-badge pg-badge--dot" id="dev-status"></span><span class="pg-badge" id="dev-hz"></span><span class="pg-badge" id="dev-extra" hidden></span></div>
              </div>
            </div>
            <div class="pg-usbstage">
              <div class="app-dialwrap">
                <div class="pg-dial" id="dial">
                  <svg viewBox="0 0 264 264"><circle class="guide" cx="132" cy="132" r="92"/><circle class="guide guide--dash" cx="132" cy="132" r="62"/><circle class="guide" cx="132" cy="132" r="34"/><line class="cross" x1="132" y1="40" x2="132" y2="224"/><line class="cross" x1="40" y1="132" x2="224" y2="132"/><line class="tick" x1="187.0" y1="36.7" x2="193.0" y2="26.3"/><line class="tick" x1="227.3" y1="77.0" x2="237.7" y2="71.0"/><line class="tick tick--major" x1="235.0" y1="132.0" x2="254.0" y2="132.0"/><line class="tick" x1="227.3" y1="187.0" x2="237.7" y2="193.0"/><line class="tick" x1="187.0" y1="227.3" x2="193.0" y2="237.7"/><line class="tick tick--major" x1="132.0" y1="235.0" x2="132.0" y2="254.0"/><line class="tick" x1="77.0" y1="227.3" x2="71.0" y2="237.7"/><line class="tick" x1="36.7" y1="187.0" x2="26.3" y2="193.0"/><line class="tick tick--major" x1="29.0" y1="132.0" x2="10.0" y2="132.0"/><line class="tick" x1="36.7" y1="77.0" x2="26.3" y2="71.0"/><line class="tick" x1="77.0" y1="36.7" x2="71.0" y2="26.3"/><path class="level" d="M132 9l7 15h-14z"/></svg>
                  <div class="pg-dial__well"></div><div class="pg-dial__bubble" id="dial-bubble"></div>
                </div>
                <span class="pg-dial__label" id="dial-label">LEVEL</span>
              </div>
            </div>
            <div class="app-devfoot">
              <span class="pg-badge pg-badge--ok app-linkbadge" id="dev-link"></span>
              <span class="pg-timer"><span data-i18n="status.connected_time">Подключен</span> <b id="dev-timer">00:00:00</b></span>
            </div>
            <button class="pg-btn pg-btn--info pg-btn--block" id="btn-recenter" type="button" data-i18n-title="recenter.btn_main_tip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span data-i18n="recenter.btn_main">Центрировать 3D-вид</span></button>
          </section>
        </div>
        <div class="pg-usb__col">
          <div class="app-dsu-slot" data-dsu-slot="dash"></div>
          <button class="pg-btn pg-btn--block pg-btn--lg app-pause" id="btn-pause" type="button" data-i18n="controls.pause">ПАУЗА</button>
          <section class="pg-card app-profiles" id="profiles">
            <div class="app-row-between">
              <div class="pg-overline"><span class="pg-ring"></span><span data-i18n="ui.profiles_title">Профили управления</span></div>
              <span class="pg-badge pg-badge--ok" id="prof-slot" hidden></span>
            </div>
            <div class="app-profwrap">
              <button class="pg-profile app-profbtn" id="prof-current" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span class="app-grow"><span class="pg-profile__t" id="prof-name"></span><span class="pg-profile__s" id="prof-sub"></span></span>
                <span class="pg-badge pg-badge--danger" id="prof-outdated" hidden data-i18n="calibration.outdated_badge">Устарел</span>
                <span class="pg-badge pg-badge--info" id="prof-slotbadge" hidden></span>
                <svg class="chev" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg>
              </button>
              <div class="app-menu" id="prof-menu" role="listbox" hidden></div>
            </div>
            <div class="pg-notice pg-notice--warn" id="prof-warn" hidden><span data-i18n="calibration.outdated_warning_banner"></span></div>
            <div class="pg-row app-row-flat" id="prof-mount" hidden>
              <div class="pg-row__label"><span id="prof-mount-text"></span><button class="pg-info" type="button" aria-label="Info" data-i18n-title="calibration.mount_profile_tip">i</button></div>
              <div class="pg-row__control"><label class="pg-toggle"><input type="checkbox" id="prof-mount-toggle" aria-label="mount"><span class="pg-toggle__track"></span></label></div>
            </div>
            <div class="pg-mono-note" id="prof-axes"></div>
            <button class="pg-btn pg-btn--block" id="btn-calibrate" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span data-i18n="ui.calibrate">Калибровка</span></button>
          </section>
        </div>
      </div>
    </main>

    <!-- Initial setup (design: ScreenSetup) -->
    <main class="pg-page pg-page--center app-screen" id="screen-setup" hidden>
      <section class="pg-card pg-card--hero pg-wiz app-wiz" id="wiz">
        <button class="pg-btn-icon app-wiz-close" id="wiz-close" type="button" data-i18n-title="ui.close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <!-- step 0: platform -->
        <div class="app-wiz-pick" id="wiz-pick">
          <div class="display-xl app-wiz-title" data-i18n="setup.title">Начальная настройка</div>
          <div class="body app-sub" data-i18n="setup.select_platform"></div>
          <div class="app-platforms">
            <button class="pg-card app-platform" type="button" data-platform="ios"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><span class="display-sm" data-i18n="setup.ios_title">iOS</span><span class="body-sm app-sub" data-i18n="setup.ios_desc"></span></button>
            <button class="pg-card app-platform" type="button" data-platform="android"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M10 6h4"/></svg><span class="display-sm" data-i18n="setup.android_title">Android</span><span class="body-sm app-sub" data-i18n="setup.android_desc"></span></button>
          </div>
        </div>
        <!-- android -->
        <div class="app-wiz-android" id="wiz-android" hidden>
          <div class="display-xl app-wiz-title" data-i18n="setup.android_title">Android</div>
          <div class="app-wiz-text" data-md="setup.android_hint"></div>
          <div class="pg-qr"><img class="app-qr" id="wiz-android-qr" width="176" height="176" alt=""></div>
          <div class="pg-url"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="pg-url__text" id="wiz-android-url">…</span><button class="pg-btn pg-btn--sm" type="button" data-copy="wiz-android-url" data-i18n="qr.copy">Копировать</button></div>
        </div>
        <!-- iOS steps -->
        <div class="app-wiz-ios" id="wiz-ios" hidden>
          <div class="app-center"><span class="pg-badge pg-badge--step" id="wiz-step-badge"></span><div class="display-xl app-wiz-title" id="wiz-step-title"></div></div>
          <div class="pg-wiz__grid">
            <div class="pg-wiz__main">
              <div class="app-wiz-text" id="wiz-step-text"></div>
              <div id="wiz-step1-extra">
                <div class="pg-qr app-qr-sm"><img class="app-qr" id="wiz-setup-qr" width="150" height="150" alt=""></div>
                <div class="pg-url"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="pg-url__text" id="wiz-setup-url">…</span><button class="pg-btn pg-btn--sm" type="button" data-copy="wiz-setup-url" data-i18n="qr.copy">Копировать</button></div>
                <details class="pg-disclosure"><summary data-i18n="setup.disclosure_title"></summary><div class="pg-disclosure__body"><p data-md="setup.disclosure_body_1"></p><p data-md="setup.disclosure_body_2"></p><p data-md="setup.disclosure_body_3"></p><p data-md="setup.disclosure_body_4"></p></div></details>
              </div>
              <span class="pg-badge app-stepbadge" id="wiz-step-hint"></span>
            </div>
            <div class="pg-devshot pg-wiz__shot"><img id="wiz-shot" alt=""></div>
          </div>
        </div>
        <div class="pg-wiz__foot" id="wiz-foot" hidden>
          <button class="pg-btn app-wiz-back" id="wiz-back" type="button" data-i18n="setup.btn_back">← Назад</button>
          <div class="pg-dots" id="wiz-dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <button class="pg-btn pg-btn--primary pg-btn--lg app-wiz-next" id="wiz-next" type="button" data-i18n="setup.btn_next">Далее →</button>
        </div>
      </section>
    </main>

    <!-- Settings (design: ScreenSettings): rows are built by js/screens/settings.js -->
    <main class="pg-set app-screen" id="screen-settings" hidden>
      <div class="pg-set__main" id="set-col-1"></div>
      <div class="pg-set__main" id="set-col-2"></div>
    </main>

    <!-- Screens that are still being moved over -->
    <main class="pg-page pg-page--center app-screen" id="screen-soon" hidden>
      <section class="pg-card pg-card--hero pg-rings-corner pg-conn">
        <div class="display-lg" id="soon-title"></div>
        <div class="body app-sub" data-i18n="ui.soon_desc"></div>
      </section>
    </main>
  </div>

  <!-- ───────── Floating header: navigation · controls ───────── -->
  <header class="pg-header pg-header--two" id="header">
    <nav class="pg-island" id="nav">
      <button class="pg-tab" type="button" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="pg-tab__l" data-i18n="nav.settings">Настройки</span></button>
      <button class="pg-tab" type="button" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg><span class="pg-tab__l" data-i18n="nav.stats">Статистика &amp; 3D</span></button>
      <button class="pg-tab" type="button" data-tab="docs"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20"/></svg><span class="pg-tab__l" data-i18n="ui.docs">Документация</span></button>
    </nav>
    <div class="pg-island">
      <button class="pg-btn-icon" id="btn-theme" type="button" aria-label="Theme" data-i18n-title="app.theme_toggle"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg></button>
      <div class="pg-seg" id="lang-seg" role="radiogroup"><button class="pg-seg__btn" type="button" data-lang="ru">RU</button><button class="pg-seg__btn" type="button" data-lang="en">EN</button></div>
      <span class="pg-status" id="status"><span class="pg-status__dot"></span><span class="pg-status__t" id="status-t">офлайн</span></span>
    </div>
  </header>

  <!-- ───────── Floating footer: resources · version and repository ───────── -->
  <footer class="pg-footer" id="footer">
    <div class="pg-footer__group">
      <div class="pg-island pg-island--sm pg-f-cpu" data-i18n-title="footer.cpu_tip"><span class="pg-dim" data-i18n="footer.cpu">ЦП</span><svg class="pg-mini" viewBox="0 0 44 16" preserveAspectRatio="none"><path id="cpu-area"/><polyline id="cpu-line"/></svg><b id="cpu-val">0%</b></div>
      <div class="pg-island pg-island--sm pg-f-ram" data-i18n-title="footer.ram_tip"><span class="pg-dim" data-i18n="footer.ram">ОЗУ</span><b id="ram-val">0 MB</b><span class="pg-meter"><i id="ram-bar"></i></span></div>
    </div>
    <a class="pg-island pg-island--sm pg-f-repo" id="repo" href="https://github.com/MrHoustonOff/PhoneGyro"><span class="pg-dim" id="ft-ver"></span><span class="pg-badge pg-badge--warn app-chan" id="ft-chan" hidden></span><span class="pg-island__sep app-sep"></span><span class="app-gh"><svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg></span><span class="pg-f-repo__n">MrHoustonOff/PhoneGyro</span></a>
  </footer>
</div>

<!-- ───────── Launch animation (design: Splash), removed when it ends ───────── -->
<div class="pg-splash app-splash" id="splash" aria-hidden="true">
  <div class="pg-splash__win">
    <div class="pg-splash__tex"></div>
    <svg class="pg-splash__rings" viewBox="-300 -300 600 600"><circle r="46" style="--i:0;--c:289.0px;--o:.55"/><circle r="86" style="--i:1;--c:540.4px;--o:.49"/><circle r="126" style="--i:2;--c:791.7px;--o:.43"/><circle r="166" style="--i:3;--c:1043.0px;--o:.37"/><circle r="206" style="--i:4;--c:1294.3px;--o:.31"/><circle r="246" style="--i:5;--c:1545.7px;--o:.25"/><circle r="286" style="--i:6;--c:1797.0px;--o:.19"/><circle r="326" style="--i:7;--c:2048.3px;--o:.13"/></svg>
    <div class="pg-splash__center">
      <img class="pg-splash__mark" src="img/logo.webp" alt="" width="76" height="76">
