<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0b">
<title>PhoneGyro Controller</title>
<link rel="preload" as="font" type="font/woff2" crossorigin href="/m/__APP_VERSION__/Onest-Regular.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/m/__APP_VERSION__/Onest-SemiBold.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/m/__APP_VERSION__/AlegreyaSans-ExtraBold.woff2">
<script>
/* Theme before the first paint: no flash of the wrong one. */
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('gb_theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* PhoneGyro phone page. Design: docs/internal/Design (tokens, Dial, MobileBar, PauseCard, LockButton).
   Fonts and textures come from /m/ (web/assets), fetched once and cached. */
@font-face{font-family:"Onest";src:url(/m/__APP_VERSION__/Onest-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Onest";src:url(/m/__APP_VERSION__/Onest-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url(/m/__APP_VERSION__/AlegreyaSans-ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/m/__APP_VERSION__/JetBrainsMono-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/m/__APP_VERSION__/JetBrainsMono-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}

:root,[data-theme="light"]{--bg:#f1f1f1;--surface:#fff;--surface-inset:#e8e8e8;--surface-hover:#f5f5f5;--line:rgba(0,0,0,.12);--line-subtle:rgba(0,0,0,.07);--line-control:rgba(0,0,0,.48);--ink:#0b0b0b;--ink-2:#545454;--ink-3:#646464;--on-ink:#fff;--accent:#5b7c26;--accent-text:#4a651d;--accent-soft:rgba(91,124,38,.13);--accent-line:rgba(91,124,38,.4);--info-text:#2f5f6d;--info-soft:rgba(63,117,131,.12);--info-line:rgba(63,117,131,.38);--info:#3f7583;--danger:#c2432f;--on-danger:#fff;--danger-text:#b03a27;--danger-soft:rgba(194,67,47,.1);--danger-line:rgba(194,67,47,.38);--warn:#b07c0c;--shadow-card:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);--shadow-inset:inset 0 1px 2px rgba(0,0,0,.1);--shadow-key:0 1px 0 rgba(0,0,0,.14);--tex-rings:url(/m/__APP_VERSION__/rings-light.svg);--tex-grain:url(/m/__APP_VERSION__/grain-light.png)}
[data-theme="dark"]{--bg:#0b0b0b;--surface:#151515;--surface-inset:#0a0a0a;--surface-hover:#1e1e1e;--line:rgba(255,255,255,.12);--line-subtle:rgba(255,255,255,.07);--line-control:rgba(255,255,255,.46);--ink:#f4f4f4;--ink-2:#a6a6a6;--ink-3:#8c8c8c;--on-ink:#0b0b0b;--accent:#a3bc69;--accent-text:#a3bc69;--accent-soft:rgba(163,188,105,.15);--accent-line:rgba(163,188,105,.42);--info-text:#9dbfca;--info-soft:rgba(135,170,181,.14);--info-line:rgba(135,170,181,.4);--info:#87aab5;--danger:#f29b88;--on-danger:#0b0b0b;--danger-text:#f5a999;--danger-soft:rgba(242,155,136,.14);--danger-line:rgba(242,155,136,.4);--warn:#f2cc85;--shadow-card:inset 0 1px 0 rgba(255,255,255,.05),0 8px 28px rgba(0,0,0,.55);--shadow-inset:inset 0 1px 3px rgba(0,0,0,.75);--shadow-key:0 1px 0 rgba(0,0,0,.9);--tex-rings:url(/m/__APP_VERSION__/rings-dark.svg);--tex-grain:url(/m/__APP_VERSION__/grain-dark.png)}
:root{--r-pill:9999px;--r-xl:22px;--f-display:"Alegreya Sans","Onest",system-ui,sans-serif;--f-sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;background:var(--bg) var(--tex-rings) 0 0/600px 600px;font:15px/22px var(--f-sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}

/* ── Page ─────────────────────────────────────────────────────────────────── */
.pg-phone{display:flex;flex-direction:column;gap:16px;width:100%;max-width:440px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.pg-mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border-radius:28px;background:var(--surface) var(--tex-grain);border:1px solid var(--line);box-shadow:var(--shadow-card)}
.pg-mchip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--r-pill);background:var(--surface-inset);box-shadow:var(--shadow-inset);font-weight:600;font-size:16px;white-space:nowrap}
.pg-mchip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pg-mchip__dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}
.pg-mchip__dot.is-on{background:var(--accent)}
.pg-mchip__dot.is-usb{background:var(--info)}
.pg-mbar__end{display:flex;gap:8px;flex:none}
.pg-mchip{min-width:0}
.pg-mchip>span:not(.pg-mchip__dot){overflow:hidden;text-overflow:ellipsis}
.pg-mchip__dot{flex:none}
@media (max-width:380px){.pg-mchip{padding:0 12px}.pg-mbar__end{gap:6px}}
.pg-roundbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:50%;border:1px solid transparent;background:var(--surface-inset);box-shadow:var(--shadow-inset);color:var(--ink-2);font:700 13px/1 var(--f-sans);letter-spacing:.02em;cursor:pointer;transition:background .15s,color .15s,transform .1s}
.pg-roundbtn:active{transform:scale(.94)}
.pg-roundbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pg-roundbtn.is-active{background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface);color:var(--accent-text);border-color:var(--accent-line)}

.pg-mstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0}
.m-level{display:flex;flex-direction:column;align-items:center;gap:8px}

/* Level dial (the one on the desktop home page): CSS and SVG only. */
.pg-dial{position:relative;width:264px;height:264px;border-radius:50%;background:var(--surface) var(--tex-grain);border:1px solid var(--line);box-shadow:var(--shadow-card)}
.pg-dial>svg{position:absolute;inset:0;width:100%;height:100%}
.pg-dial .tick{stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.pg-dial .tick--major{stroke:var(--ink);stroke-width:2.5}
.pg-dial .guide{fill:none;stroke:var(--line);stroke-width:1}
.pg-dial .guide--dash{stroke-dasharray:2 5;stroke:var(--line-control);opacity:.5}
.pg-dial .cross{stroke:var(--line-subtle);stroke-width:1}
.pg-dial .level{fill:var(--accent)}
.pg-dial__yaw{position:absolute;inset:0;will-change:transform}
.pg-dial__yaw svg{display:block;width:100%;height:100%}
.pg-dial__well{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--surface-inset);box-shadow:var(--shadow-inset);border:1px solid var(--line)}
.pg-dial__bubble{position:absolute;left:calc(50% - 15px);top:calc(50% - 15px);width:30px;height:30px;border-radius:50%;background:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .12s linear;will-change:transform}
.pg-dial__bubble.is-level{background:var(--accent)}
.pg-dial__label{display:inline-flex;align-items:center;height:32px;padding:0 20px;border-radius:var(--r-pill);background:var(--surface-inset);box-shadow:var(--shadow-inset);border:1px solid var(--line);font:600 13px/1 var(--f-mono);letter-spacing:.2em;color:var(--ink-2);white-space:nowrap}
.pg-dial__label.is-level{color:var(--accent-text);border-color:var(--accent-line)}
@media (max-height:740px){
  .pg-dial{width:224px;height:224px}
  .pg-dial__well{width:54px;height:54px;margin:-27px 0 0 -27px}
  .pg-dial__bubble{width:26px;height:26px;left:calc(50% - 13px);top:calc(50% - 13px)}
}

/* Sensors not allowed yet */
.m-warn{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:22px 18px;text-align:center;border-radius:var(--r-xl);border:1px solid var(--danger-line);background:linear-gradient(var(--danger-soft),var(--danger-soft)),var(--surface) var(--tex-grain);box-shadow:var(--shadow-card)}
.m-warn__icon{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--danger-line);background:var(--danger-soft);color:var(--danger-text)}
.m-warn__icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.m-warn__title{font:800 22px/26px var(--f-display);letter-spacing:.01em;text-transform:uppercase;color:var(--danger-text)}
.m-warn__desc{font-size:14px;line-height:20px;color:var(--ink-2);max-width:320px}

/* Buttons */
.pg-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-key);transition:background .15s,transform .1s;white-space:nowrap}
.pg-btn:active{transform:translateY(1px);box-shadow:none;background:var(--surface-hover)}
.pg-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pg-btn--danger{background:var(--danger);border-color:transparent;color:var(--on-danger)}
.pg-btn[disabled]{opacity:.45;box-shadow:none}
.pg-btn--big{width:100%;min-height:56px;border-radius:20px;font-size:16px}
.pg-mrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pg-mrow .pg-btn{min-height:56px;border-radius:20px;font-size:15px;line-height:18px;padding:0 10px;white-space:normal;text-align:center}
.pg-mrow .pg-btn svg{flex:none}
.pg-mrow .pg-btn.is-active{background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface);color:var(--accent-text);border-color:var(--accent-line)}

/* Connection card (the design's Pause card): accent = streaming, danger = no link, info = PC in USB mode */
.pg-pause{--nb:var(--accent-soft);display:block;width:100%;text-align:left;padding:16px 20px 18px;border-radius:var(--r-xl);border:1px solid var(--accent-line);background:linear-gradient(var(--nb),var(--nb)),var(--surface) var(--tex-grain);box-shadow:var(--shadow-card);color:var(--ink);cursor:pointer}
.pg-pause:active{transform:translateY(1px)}
.pg-pause__head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pg-pause__title{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:38px;letter-spacing:.01em;text-transform:uppercase;color:var(--accent-text);margin-top:6px}
.pg-pause__desc{font-size:14px;line-height:20px;color:var(--ink-2);margin-top:2px}
.pg-pause.is-off{--nb:var(--danger-soft);border-color:var(--danger-line)}
.pg-pause.is-off .pg-pause__title{color:var(--danger-text)}
.pg-pause.is-usb{--nb:var(--info-soft);border-color:var(--info-line)}
.pg-pause.is-usb .pg-pause__title{color:var(--info-text);font-size:clamp(20px,6.4vw,28px);line-height:1.15}
.pg-badge{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--accent-line);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface);color:var(--accent-text);font:600 12px/1 var(--f-mono);letter-spacing:.02em;white-space:nowrap}
.pg-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.is-off .pg-badge{border-color:var(--danger-line);background:linear-gradient(var(--danger-soft),var(--danger-soft)),var(--surface);color:var(--danger-text)}
.is-usb .pg-badge{border-color:var(--info-line);background:linear-gradient(var(--info-soft),var(--info-soft)),var(--surface);color:var(--info-text)}
.mono{font:400 13px/18px var(--f-mono);color:var(--ink-3)}

.pg-mfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 20px;height:52px;border-radius:26px;background:var(--surface) var(--tex-grain);border:1px solid var(--line);font:400 12px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}

/* ── Touch Shield (design: LockButton). Only the button, its count and its hint. ── */
.m-lock{--period:72s;position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);touch-action:none;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .3s,visibility 0s .3s}
.m-lock.active{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .3s}
/* The rings drift over one 600px tile per period; the button breathes 1 -> 0 -> 1 over the same period, started with it. */
.m-lock::before{content:"";position:absolute;inset:-600px 0 0 -600px;background:var(--tex-rings) 0 0/600px 600px;pointer-events:none;will-change:transform}
.m-lock.active::before{animation:pg-drift var(--period) linear infinite}
@keyframes pg-drift{to{transform:translate3d(600px,600px,0)}}
.pg-lock{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.m-lock.active .pg-lock{animation:m-breathe var(--period) ease-in-out infinite}
@keyframes m-breathe{0%,100%{opacity:1}50%{opacity:0}}
.m-lock .pg-lock.is-holding{opacity:1!important}
.pg-lockwrap{position:relative;display:grid;place-items:center}
.pg-sonar{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.pg-sonar i{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;border:2px solid var(--accent-line);opacity:0}
.pg-lock.is-holding .pg-sonar i{animation:pg-sonar 2.4s ease-out infinite}
.pg-lock.is-holding .pg-sonar i:nth-child(2){animation-delay:.8s}
.pg-lock.is-holding .pg-sonar i:nth-child(3){animation-delay:1.6s}
@keyframes pg-sonar{0%{transform:scale(.7);opacity:.9}100%{transform:scale(3.3);opacity:0}}
.pg-lockbtn{--hold:0;position:relative;width:148px;height:148px;border-radius:50%;border:1px solid var(--line);background:var(--surface) var(--tex-grain);box-shadow:var(--shadow-card);color:var(--ink);display:grid;place-items:center;cursor:pointer;touch-action:none;padding:0;transition:transform .15s}
.pg-lockbtn.is-holding{transform:scale(.97)}
.pg-lockbtn__ring{position:absolute;inset:-14px;width:176px;height:176px;transform:rotate(-90deg);pointer-events:none}
.pg-lockbtn__ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.pg-lockbtn__track{stroke:var(--line-control);opacity:.45}
.pg-lockbtn__prog{stroke:var(--accent);stroke-dasharray:515.2px;stroke-dashoffset:calc(515.2px * (1 - var(--hold)))}
.pg-lockbtn:not(.is-holding) .pg-lockbtn__prog{transition:stroke-dashoffset .25s}
.pg-lockbtn svg.pg-lockbtn__icon{width:62px;height:62px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pg-lock__text{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pg-lock__count{font:600 28px/32px var(--f-mono);letter-spacing:-.02em}
.pg-lock__label{color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){.m-lock.active::before,.m-lock.active .pg-lock,.pg-lock.is-holding .pg-sonar i{animation:none}}
</style>
</head>
<body data-ver="__APP_VERSION__">

<main class="pg-phone" id="app">

  <!-- Bar: device, Touch Shield, theme, language -->
  <header class="pg-mbar">
    <span class="pg-mchip" id="device-chip">
      <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
      <span id="device-model-label">iPhone</span>
      <span class="pg-mchip__dot" id="header-status-dot"></span>
    </span>
    <div class="pg-mbar__end">
      <button class="pg-roundbtn" id="btn-screensaver" type="button" aria-label="Touch Shield"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.2 8.6-7 10-3.8-1.4-7-5-7-10V6z"/></svg></button>
      <button class="pg-roundbtn" id="btn-theme" type="button" aria-label="Theme"><svg id="theme-icon" viewBox="0 0 24 24"></svg></button>
      <button class="pg-roundbtn" id="btn-lang" type="button" aria-label="Language"><span id="lang-label">RU</span></button>
    </div>
  </header>

  <!-- Stage: the level dial, or the sensor permission card -->
  <section class="pg-mstage">
    <div class="m-level" id="sensor-hud-container">
      <div class="pg-dial" id="dial">
        <svg viewBox="0 0 264 264"><circle class="guide" cx="132" cy="132" r="92"/><circle class="guide guide--dash" cx="132" cy="132" r="62"/><circle class="guide" cx="132" cy="132" r="34"/><line class="cross" x1="132" y1="40" x2="132" y2="224"/><line class="cross" x1="40" y1="132" x2="224" y2="132"/><line class="tick" x1="187.0" y1="36.7" x2="193.0" y2="26.3"/><line class="tick" x1="227.3" y1="77.0" x2="237.7" y2="71.0"/><line class="tick tick--major" x1="235.0" y1="132.0" x2="254.0" y2="132.0"/><line class="tick" x1="227.3" y1="187.0" x2="237.7" y2="193.0"/><line class="tick" x1="187.0" y1="227.3" x2="193.0" y2="237.7"/><line class="tick tick--major" x1="132.0" y1="235.0" x2="132.0" y2="254.0"/><line class="tick" x1="77.0" y1="227.3" x2="71.0" y2="237.7"/><line class="tick" x1="36.7" y1="187.0" x2="26.3" y2="193.0"/><line class="tick tick--major" x1="29.0" y1="132.0" x2="10.0" y2="132.0"/><line class="tick" x1="36.7" y1="77.0" x2="26.3" y2="71.0"/><line class="tick" x1="77.0" y1="36.7" x2="71.0" y2="26.3"/></svg>
        <div class="pg-dial__yaw" id="dial-yaw"><svg viewBox="0 0 264 264"><path class="level" d="M132 9l7 15h-14z"/></svg></div>
        <div class="pg-dial__well"></div>
        <div class="pg-dial__bubble" id="dial-bubble"></div>
      </div>
      <span class="pg-dial__label" id="hud-level-status">LEVEL</span>
    </div>

    <div class="m-warn" id="sensor-warning-card" hidden>
      <div class="m-warn__icon"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
      <div class="m-warn__title" id="txt-warn-title"></div>
      <div class="m-warn__desc" id="txt-warn-desc"></div>
      <button class="pg-btn pg-btn--danger pg-btn--big" id="btn-grant-sensors" type="button"></button>
    </div>
  </section>

  <!-- Connection -->
  <button class="pg-pause is-off" id="btn-main-connection" type="button">
    <div class="pg-pause__head">
      <span class="pg-badge" id="conn-badge"><span id="conn-badge-text"></span></span>
      <span class="mono" id="conn-hz-pill">0 Hz</span>
    </div>
    <div class="pg-pause__title" id="conn-title"></div>
    <div class="pg-pause__desc" id="conn-hint"></div>
  </button>

  <div class="pg-mrow">
    <button class="pg-btn" id="btn-toggle-socket" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 3v9M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
      <span id="txt-sub-socket"></span>
    </button>
    <button class="pg-btn" id="btn-screensaver-main" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.2 8.6-7 10-3.8-1.4-7-5-7-10V6z"/></svg>
      <span id="txt-screensaver-main"></span>
    </button>
  </div>

  <footer class="pg-mfoot"><span>PhoneGyro · <span id="txt-footer-role"></span></span><span>LAN Direct</span></footer>
</main>

<!-- Touch Shield: hold the button for 4 s to unlock. Nothing else on this screen. -->

// ─────────────────────────────────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);
function setText(el, v) { if (el.textContent !== v) el.textContent = v; }

let currentLang = localStorage.getItem('gb_lang') || 'ru';
if (!I18N[currentLang]) currentLang = 'ru';

function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('gb_lang', lang);

// ─────────────────────────────────────────────────────────────────────────────
// 2. Theme (Dark / Light)
// ─────────────────────────────────────────────────────────────────────────────
let currentTheme = localStorage.getItem('gb_theme') === 'light' ? 'light' : 'dark';
const ICON_SUN = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
const ICON_MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>';

function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('gb_theme', theme);
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', theme === 'light' ? '#f1f1f1' : '#0b0b0b');

applyTheme(currentTheme);

$('btn-theme').addEventListener('click', () => {

});

// ─────────────────────────────────────────────────────────────────────────────
// 3. Device Model Detection (iPad vs iPhone vs Android)
// ─────────────────────────────────────────────────────────────────────────────
function detectDeviceModel() {
  const ua = navigator.userAgent || '';
  const platform = navigator.platform || '';
  const maxTouchPoints = navigator.maxTouchPoints || 0;

  // iPadOS 13+ identifies as MacIntel with touch points
  const isIPad = /iPad/.test(ua) || (platform === 'MacIntel' && maxTouchPoints > 1);
  if (isIPad) return 'iPad';

  if (/iPhone|iPod/.test(ua)) return 'iPhone';
  if (/Android/.test(ua)) return 'Android';
  return 'Mobile Device';
}

const deviceModel = detectDeviceModel();
setText($('device-model-label'), deviceModel);

// ─────────────────────────────────────────────────────────────────────────────
// 4. Screen Lock (WakeLock API tied exclusively to the Touch Shield)
// ─────────────────────────────────────────────────────────────────────────────
let wakeLock = null;
let wakeLockEnabled = false;

async function requestWakeLock() {
  if (!wakeLockEnabled) return;
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
      });
    }
  } catch (err) {}
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}

// Re-acquire WakeLock on visibility change if the shield is on; dismiss the shield on hide
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (wakeLockEnabled) requestWakeLock();
    hudDirty = true;
    scheduleHud();
    if (typeof ws !== 'undefined' && ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(JSON.stringify({ type: 'visibility', visible: true })); } catch (e) {}
    }
  } else if (document.visibilityState === 'hidden') {
    if (isScreensaverActive) {
      closeScreensaver();
    } else {
      releaseWakeLock();
    }
    if (typeof ws !== 'undefined' && ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(JSON.stringify({ type: 'visibility', visible: false })); } catch (e) {}
    }
  }
});

// Dismiss the shield and release WakeLock on pagehide or blur
window.addEventListener('pagehide', () => {
  if (isScreensaverActive) closeScreensaver();
  releaseWakeLock();
});
window.addEventListener('blur', () => {
  if (isScreensaverActive) closeScreensaver();
  releaseWakeLock();
});

// ─────────────────────────────────────────────────────────────────────────────
// 5. Touch Shield (hold the lock button for 4 s)
// ─────────────────────────────────────────────────────────────────────────────
const screensaverOverlay = $('screensaver-overlay');
const btnScreensaver     = $('btn-screensaver');
const btnScreensaverMain = $('btn-screensaver-main');
const lockEl             = $('ss-lock');
const lockBtn            = $('ss-lock-btn');
const lockCount          = $('ss-count');

let isScreensaverActive = false;
let holdRaf = 0;
let holdStartTime = 0;
let lastCount = '';
const HOLD_DURATION = 4000; // 4.0 s hold to unlock

function openScreensaver() {
  isScreensaverActive = true;
  screensaverOverlay.classList.add('active');
  btnScreensaver.classList.add('is-active');
  btnScreensaverMain.classList.add('is-active');
  wakeLockEnabled = true;
  requestWakeLock();
}

function closeScreensaver() {
  isScreensaverActive = false;
  screensaverOverlay.classList.remove('active');
  btnScreensaver.classList.remove('is-active');
  btnScreensaverMain.classList.remove('is-active');
  cancelHold();
  wakeLockEnabled = false;
  releaseWakeLock();
  if (navigator.vibrate) navigator.vibrate([40, 50, 40]);
  // what the page missed while covered
  updateConnectionUI();
  hudDirty = true;
  scheduleHud();
}

btnScreensaver.addEventListener('click', openScreensaver);
btnScreensaverMain.addEventListener('click', openScreensaver);

function holdStep(now) {
  if (!holdStartTime) { holdRaf = 0; return; }
  const p = Math.min(1, (now - holdStartTime) / HOLD_DURATION);
  lockBtn.style.setProperty('--hold', p.toFixed(3));
  const left = (HOLD_DURATION * (1 - p) / 1000).toFixed(1) + ' s';
  if (left !== lastCount) { lastCount = left; lockCount.textContent = left; }
  if (p >= 1) {
    holdRaf = 0;
    closeScreensaver();
    return;
  }
  holdRaf = requestAnimationFrame(holdStep);
}

function startHold(e) {
  e.preventDefault();
  if (holdStartTime) return;
  try { lockBtn.setPointerCapture(e.pointerId); } catch (err) {}
  holdStartTime = performance.now();
  lockEl.classList.add('is-holding');
  lockBtn.classList.add('is-holding');
  if (navigator.vibrate) navigator.vibrate(25);
  holdRaf = requestAnimationFrame(holdStep);
}

function cancelHold() {
  holdStartTime = 0;
  if (holdRaf) { cancelAnimationFrame(holdRaf); holdRaf = 0; }
  lockEl.classList.remove('is-holding');
  lockBtn.classList.remove('is-holding');
  lockBtn.style.setProperty('--hold', '0');   // the ring runs back in 250 ms (CSS)
  lastCount = '4.0 s';
  lockCount.textContent = lastCount;
}

lockBtn.addEventListener('pointerdown', startHold);
lockBtn.addEventListener('pointerup', cancelHold);
lockBtn.addEventListener('pointercancel', cancelHold);
lockBtn.addEventListener('contextmenu', (e) => e.preventDefault());
lockBtn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) startHold(e); });
lockBtn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') cancelHold(); });

// Nothing under the shield may be touched
screensaverOverlay.addEventListener('click', (e) => {
  e.stopPropagation();
});

// ─────────────────────────────────────────────────────────────────────────────
// 6. WebSocket Connection & Interactive State Machine
// ─────────────────────────────────────────────────────────────────────────────
let ws = null;
let isConnected = false;
let isModeBlocked = false;
let deliberateDisconnect = false;
let packetCount = 0;
let lastPacketCount = 0;
let lastHzCalcTime = performance.now();
let currentHz = 0;

const btnMainConnection = $('btn-main-connection');
const connBadgeText     = $('conn-badge-text');
const connTitle         = $('conn-title');
const connHint          = $('conn-hint');
const connHzPill        = $('conn-hz-pill');
const headerStatusDot   = $('header-status-dot');
const btnToggleSocket   = $('btn-toggle-socket');
const txtSubSocket      = $('txt-sub-socket');

function updateConnectionUI() {
  const t = I18N[currentLang];

  if (isModeBlocked) {
    btnMainConnection.className = 'pg-pause is-usb';
    setText(connBadgeText, t.blocked_badge);
    setText(connTitle, t.action_blocked);
    setText(connHint, t.hint_blocked);
    headerStatusDot.className = 'pg-mchip__dot is-usb';
    setText(txtSubSocket, t.sub_blocked);
    setText(connHzPill, 'USB');
    return;
  }

  if (!isConnected) {
    btnMainConnection.className = 'pg-pause is-off';
    setText(connBadgeText, deliberateDisconnect ? t.disconnected_badge : t.connecting_badge);
    setText(connTitle, t.action_connect);
    setText(connHint, t.hint_disconnected);
    headerStatusDot.className = 'pg-mchip__dot';
    setText(txtSubSocket, t.sub_connect);
    setText(connHzPill, '0 Hz');
  } else {
    btnMainConnection.className = 'pg-pause';
    setText(connBadgeText, t.streaming_badge);
    setText(connTitle, t.action_streaming);
    setText(connHint, t.hint_streaming);
    headerStatusDot.className = 'pg-mchip__dot is-on';
    setText(txtSubSocket, t.sub_disconnect);
    setText(connHzPill, `${currentHz} Hz`);
  }
}

// Calculate client-side transmission Hz
setInterval(() => {
  const now = performance.now();
  const dt = (now - lastHzCalcTime) / 1000;
  if (dt > 0.4) {
    currentHz = Math.round((packetCount - lastPacketCount) / dt);
    lastPacketCount = packetCount;
    lastHzCalcTime = now;
    // nobody sees the number while the shield or another app covers the page
    if (isConnected && !isModeBlocked && !isScreensaverActive && !document.hidden) setText(connHzPill, `${currentHz} Hz`);
  }
}, 500);

function connectWSS() {
  if (isModeBlocked) {
    updateConnectionUI();
    return;
  }
  deliberateDisconnect = false;
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
    return;
  }

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws?device=${encodeURIComponent(deviceModel)}`;
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    isConnected = true;
    updateConnectionUI();

    // Report device model immediately via JSON message
    try {
      ws.send(JSON.stringify({ type: 'device', model: deviceModel }));
    } catch (e) {}
  };

  ws.onmessage = async (e) => {
    let text = '';
    if (e.data instanceof ArrayBuffer) {
      text = new TextDecoder().decode(e.data);
    } else if (e.data instanceof Blob) {
      text = await e.data.text();
    } else if (typeof e.data === 'string') {
      text = e.data;
    }

    if (!text) return;
    if (text === 'PING') {
      if (ws && ws.readyState === WebSocket.OPEN) {
        try { ws.send('PONG'); } catch (err) {}
      }
      return;
    }

    try {
      const msg = JSON.parse(text);
      if (msg.type === 'mode') {
        const blocked = (msg.mode === 'usb' && msg.blocked);
        if (blocked !== isModeBlocked) {
          isModeBlocked = blocked;
          if (isModeBlocked) {
            isConnected = false;
          }
          updateConnectionUI();
        }
        return;
      }
    } catch (err) {}
  };

  ws.onclose = () => {
    isConnected = false;
    updateConnectionUI();
    if (isScreensaverActive) closeScreensaver();
    if (!deliberateDisconnect && !isModeBlocked) {
      setTimeout(connectWSS, 2000);
    }
  };

  ws.onerror = () => {
    isConnected = false;
    updateConnectionUI();
    if (isScreensaverActive) closeScreensaver();
    if (!deliberateDisconnect && !isModeBlocked) {
      setTimeout(connectWSS, 2000);
    }
  };
}

// Background polling for mode synchronization. A live socket hears about a mode
// change from the PC itself (and is closed by it), so the poll runs only while
// there is no link or the PC is in USB mode, and not while the page is hidden.
async function checkServerMode() {
  if (document.hidden || (isConnected && !isModeBlocked)) return;
  try {
    const res = await fetch('/api/mode?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      const blocked = (data.mode === 'usb');
      if (blocked !== isModeBlocked) {
        isModeBlocked = blocked;
        if (isModeBlocked) {
          isConnected = false;
        }
        updateConnectionUI();
        if (!isModeBlocked && !deliberateDisconnect && !isConnected) {
          connectWSS();
        }
      }
    }
  } catch (e) {}
}
setInterval(checkServerMode, 1500);
checkServerMode();

// Main Connection Button Click: Reconnect / enable sensors
btnMainConnection.addEventListener('click', async () => {
  if (navigator.vibrate) navigator.vibrate(20);

  if (isModeBlocked) {
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    alert(I18N[currentLang].blocked_alert);
    return;
  }

  if (!isConnected) {
    connectWSS();
    return;
  }

  // Ensure sensors are activated if user tapped main button
  if (!sensorsActive && needsPermission) {
    requestSensors();
  }
});

// Secondary Action: Disconnect / Force Reconnect Toggle
btnToggleSocket.addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate(20);
  if (isScreensaverActive) closeScreensaver();
  if (isModeBlocked) {
    alert(I18N[currentLang].blocked_alert);
    return;
  }
  if (isConnected) {
    deliberateDisconnect = true;
    if (ws) ws.close();
  } else {
    deliberateDisconnect = false;
    connectWSS();
  }
});

// Start initial WebSocket connection
connectWSS();

// ─────────────────────────────────────────────────────────────────────────────
// 7. Sensor Capture & High-Performance Telemetry Streaming
// ─────────────────────────────────────────────────────────────────────────────
const G_CONST = 9.80665;
const DEG2RAD_HALF = Math.PI / 360;

// 58-byte frame: uint64 ts_us, 3×f32 rate, 4×f32 quat, 3×f32 accel, u16 flags,
// u32 sensor events, u32 dropped events (the server reads the first 50 bytes the same way).
const binBuffer = new ArrayBuffer(58);
const binView   = new DataView(binBuffer);

let curAlpha = 0, curBeta = 0, curGamma = 0;
let zeroYawOffset = 0;
let outQx = 0, outQy = 0, outQz = 0, outQw = 1;
let quatDirty = false;
let dsuAccX = 0, dsuAccY = 0, dsuAccZ = 0;
let lastMotionTime = 0;

function onOrientation(e) {
  if (e.alpha !== null || e.beta !== null || e.gamma !== null) {
    onSensorDataReceived();
  }
  curAlpha = e.alpha || 0;
  curBeta  = e.beta  || 0;
  curGamma = e.gamma || 0;
  quatDirty = true;      // the quaternion is built when a frame is sent, not on every event

  // The level dial redraws once per display frame, and only while it is visible.
  hudDirty = true;
  scheduleHud();

  if (performance.now() - lastMotionTime > 200) {
    flushMotion();
  }
}

// Convert device orientation to a unit quaternion.
// Raw alpha (no recenter offset): the server's drift anchor needs a reference
// without artificial jumps.
// W3C DeviceOrientation: R = Rz(alpha) · Rx(beta) · Ry(gamma), device → world.
// iOS computes this attitude internally at a high rate, so the server uses it
// to keep the 60 Hz gyro integration from drifting (gui/internal/motion/attitudeanchor.go).
function updateQuaternion() {
  quatDirty = false;
  const a = curAlpha * DEG2RAD_HALF;
  const b = curBeta  * DEG2RAD_HALF;
  const c = curGamma * DEG2RAD_HALF;

  const cA = Math.cos(a), sA = Math.sin(a);
  const cB = Math.cos(b), sB = Math.sin(b);
  const cC = Math.cos(c), sC = Math.sin(c);

  outQw = cA * cB * cC - sA * sB * sC;
  outQx = cA * sB * cC - sA * cB * sC;
  outQy = cA * cB * sC + sA * sB * cC;
  outQz = sA * cB * cC + cA * sB * sC;

  if (outQw < 0) {
    outQx = -outQx; outQy = -outQy; outQz = -outQz; outQw = -outQw;
  }
}

// ── Level dial (design: Dial, the home-page block; CSS and SVG only) ──────────
const dialEl     = $('dial');
const bubbleEl   = $('dial-bubble');
const yawEl      = $('dial-yaw');
const hudStatus  = $('hud-level-status');
const PX_PER_DEG = 2;     // bubble travel on the 264 px dial
const MAX_PX     = 58;    // the dial's travel limit
const LEVEL_DEG  = 3.0;   // the phone counts as level within this tilt

let hudDirty = false, hudRaf = 0;
let lastBx = NaN, lastBy = NaN, lastYaw = NaN, lastLevel = null, lastLabel = '', lastLabelAt = 0, lastLabelLevel = null;
let dialScale = 1;

function measureDial() { dialScale = dialEl.clientWidth / 264 || 1; hudDirty = true; scheduleHud(); }
window.addEventListener('resize', measureDial);
window.addEventListener('orientationchange', measureDial);

function scheduleHud() {
  if (hudRaf || !hudDirty) return;
  hudRaf = requestAnimationFrame(hudFrame);
}

function hudFrame() {
  hudRaf = 0;
  // Covered by the shield or hidden: skip all drawing, the next show repaints.
  if (!hudDirty || isScreensaverActive || document.hidden) return;
  hudDirty = false;

  const pitch = curBeta, roll = curGamma;
  const clamp = (v) => Math.max(-MAX_PX, Math.min(MAX_PX, v * PX_PER_DEG));
  // Roll right -> bubble right; pitch forward -> bubble down (the user's preference).
  const bx = Math.round(clamp(roll) * dialScale * 2) / 2;
  const by = Math.round(clamp(pitch) * dialScale * 2) / 2;
  if (bx !== lastBx || by !== lastBy) {
    lastBx = bx; lastBy = by;
    bubbleEl.style.transform = `translate3d(${bx}px,${by}px,0)`;
  }

  const isLevel = Math.abs(pitch) <= LEVEL_DEG && Math.abs(roll) <= LEVEL_DEG;
  if (isLevel !== lastLevel) {
    lastLevel = isLevel;
    bubbleEl.classList.toggle('is-level', isLevel);
    hudStatus.classList.toggle('is-level', isLevel);
  }

  // Compass arrow: heading, quarter-degree steps
  const yaw = Math.round(((curAlpha - zeroYawOffset + 360) % 360) * 4) / 4;
  if (yaw !== lastYaw) {
    lastYaw = yaw;
    yawEl.style.transform = `rotate(${yaw}deg)`;
  }

  // Label: LEVEL, or the larger tilt and its angle
  let label;
  if (isLevel) {
    label = I18N[currentLang].level_status;
  } else {
    const rollBigger = Math.abs(roll) >= Math.abs(pitch);
    const v = rollBigger ? roll : pitch;
    label = `${rollBigger ? 'ROLL' : 'PITCH'} ${v >= 0 ? '+' : ''}${v.toFixed(0)}°`;
  }
  // The text costs a layout when it changes: at most 10 times a second, but a level flip at once.
  const now = performance.now();
  if (label !== lastLabel && (now - lastLabelAt > 100 || isLevel !== lastLabelLevel)) {
    lastLabel = label; lastLabelAt = now; lastLabelLevel = isLevel;
    hudStatus.textContent = label;
  }
  if (label !== lastLabel) { hudDirty = true; scheduleHud(); }   // pick the newest text up on a later frame
}
measureDial();

function readRawGyro(e) {
  if (!e.rotationRate) return { x: 0, y: 0, z: 0 };
  return {
    x: e.rotationRate.beta  || 0,
    y: e.rotationRate.gamma || 0,
    z: e.rotationRate.alpha || 0
  };
}

function readRawAccel(e) {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a) return { x: 0, y: 0, z: 0 };
  return {
    x: a.x != null ? a.x / G_CONST : 0,
    y: a.y != null ? a.y / G_CONST : 0,
    z: a.z != null ? a.z / G_CONST : 0
  };
}

function onMotion(e) {
  lastMotionTime = performance.now();
  onSensorDataReceived();

  const gyr = readRawGyro(e);
  const acc = readRawAccel(e);

  // Frames skipped while the socket is busy must not lose rotation: accumulate
  // angle (rate × dt) and send the average rate over the whole unsent interval.
  const now = performance.now();
  const gapSec = rotAccumPrevTs ? (now - rotAccumPrevTs) / 1000 : 0;
  const dt = rotAccumPrevTs ? Math.min(Math.max(gapSec, 0.001), 0.1) : 1 / 60;
  rotAccumPrevTs = now;
  sensorEvents = (sensorEvents + 1) >>> 0;
  // The OS delivered no motion for a while (page/JS freeze, backgrounding):
  // the rotation in that gap was never measured and cannot be recovered here.
  // Count the samples that should have arrived (60 Hz) as lost, so it shows up
  // in the app (loss card, data-loss sound) instead of vanishing silently.
  if (gapSec > 0.15) {
    const missed = Math.max(0, Math.round(gapSec * 60) - 1);
    sensorEvents = (sensorEvents + missed) >>> 0;
    sensorDropped = (sensorDropped + missed) >>> 0;
  }
  // Very long socket stall: start over (the server's attitude anchor re-converges
  // it). 0.85 s + one event (dt <= 0.1 s) keeps every frame's span under the 1 s
  // the server still trusts as a device interval (pkg/server MaxSourceDeltaUs).
  if (rotAccumDt > 0.85) {
    sensorDropped = (sensorDropped + rotAccumEvents) >>> 0; // their rotation is gone
    rotAccumQ = [1, 0, 0, 0]; rotAccumDt = 0; rotAccumEvents = 0;
  }
  // Compose, don't add: summing rotation vectors is only right for small or
  // same-axis turns. During a socket stall in fast multi-axis motion the sum
  // was off by tens of degrees (median 78° for a 633 ms stall on real logs).
  rotAccumQ = quatMul(rotAccumQ, quatExp(gyr.x * dt * DEG2RAD, gyr.y * dt * DEG2RAD, gyr.z * dt * DEG2RAD));
  rotAccumDt += dt;
  rotAccumEvents++;

  dsuAccX = acc.x;
  dsuAccY = acc.y;
  dsuAccZ = acc.z;

  flushMotion();
}

// Rotation accumulated since the last delivered frame, as a unit quaternion
// [w, x, y, z] in the rotationRate axes (body frame, right-multiplied like the
// server and every DSU client integrate it).
let rotAccumQ = [1, 0, 0, 0], rotAccumDt = 0, rotAccumPrevTs = 0;
const DEG2RAD = Math.PI / 180;

function quatMul(a, b) {
  return [
    a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
    a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
    a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
    a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0],
  ];
}

// quatExp: rotation vector (radians) -> unit quaternion.
function quatExp(x, y, z) {
  const th = Math.hypot(x, y, z);
  if (th < 1e-12) return [1, x / 2, y / 2, z / 2];
  const s = Math.sin(th / 2) / th;
  return [Math.cos(th / 2), x * s, y * s, z * s];
}

// quatLog: unit quaternion -> rotation vector (radians), shortest path. Its
// exp is exactly the accumulated rotation, which is what the frame must carry.
function quatLog(q) {
  let [w, x, y, z] = q;
  if (w < 0) { w = -w; x = -x; y = -y; z = -z; }
  const v = Math.hypot(x, y, z);
  if (v < 1e-12) return [2 * x, 2 * y, 2 * z];
  const k = 2 * Math.atan2(v, w) / v;
  return [x * k, y * k, z * k];
}

// Cumulative counters for the app's honest link statistics (gui/internal/link/loss.go):
// every DeviceMotion event, and the events whose rotation a very long stall
// discarded. The server derives how many samples had to share one packet.
let sensorEvents = 0, sensorDropped = 0, rotAccumEvents = 0;

// Integration clock (µs). Each frame's timestamp is the previous one plus EXACTLY
// the interval its rate was averaged over, so the server — and every DSU client
// after it — integrates rate × Δts = the rotation actually measured, no matter
// how Wi-Fi bunches or delays the packets (pkg/dsu stampMotion). Monotonic; only
// deltas are meaningful.
let sampleClockUs = Math.round(performance.now() * 1000);

// flushMotion sends the rotation accumulated since the last delivered frame as
// one average rate over its interval. With nothing pending (keep-alive paths) it
// sends a zero rate spanning 1 µs: the link stays alive and no stale rate is
// ever integrated twice.
function flushMotion() {
  let rx = 0, ry = 0, rz = 0, spanSec = 1e-6;
  if (rotAccumDt > 0) {
    // Mean rate whose rotation over the whole interval is exactly the composed one.
    const v = quatLog(rotAccumQ);
    rx = v[0] / DEG2RAD / rotAccumDt;
    ry = v[1] / DEG2RAD / rotAccumDt;
    rz = v[2] / DEG2RAD / rotAccumDt;
    spanSec = rotAccumDt;
  }
  const ts = sampleClockUs + spanSec * 1e6;
  if (!sendFrame(ts, rx, ry, rz)) return false; // socket busy: keep accumulating
  sampleClockUs = ts;
  rotAccumQ = [1, 0, 0, 0];
  rotAccumDt = 0;
  rotAccumEvents = 0;
  return true;
}

function sendFrame(tsUs, rateX, rateY, rateZ) {
  if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN || ws.bufferedAmount > 0) return false;
  if (quatDirty) updateQuaternion();

  const ts = Math.round(tsUs);
  binView.setUint32(0,  ts % 4294967296, true);             // ts_us low
  binView.setUint32(4,  Math.floor(ts / 4294967296), true); // ts_us high
  binView.setFloat32(8,  rateX,   true); // Pitch (RotX)
  binView.setFloat32(12, rateY,   true); // Yaw   (RotY)
  binView.setFloat32(16, rateZ,   true); // Roll  (RotZ)
  binView.setFloat32(20, outQx,   true);
  binView.setFloat32(24, outQy,   true);
  binView.setFloat32(28, outQz,   true);
  binView.setFloat32(32, outQw,   true);
  binView.setFloat32(36, dsuAccX, true);
  binView.setFloat32(40, dsuAccY, true);
  binView.setFloat32(44, dsuAccZ, true);
  binView.setUint16(48,  0, true); // flags (reserved; pause was removed)
  binView.setUint32(50,  sensorEvents,  true);
  binView.setUint32(54,  sensorDropped, true);

  ws.send(binBuffer);
  packetCount++;
  return true;
}

// Client idle heartbeat: keep connection alive even when phone is still on table
setInterval(() => {
  if (isConnected && ws && ws.readyState === WebSocket.OPEN) {
    if (performance.now() - lastMotionTime > 1200) {
      flushMotion();
    }
  }
}, 1000);

// ─────────────────────────────────────────────────────────────────────────────
// 8. Sensor Permission Warning & Activation Handler
// ─────────────────────────────────────────────────────────────────────────────
const needsPermission = typeof DeviceMotionEvent !== 'undefined' &&
                        typeof DeviceMotionEvent.requestPermission === 'function';
let sensorsActive = false;
const sensorWarningCard = $('sensor-warning-card');
const sensorHudContainer= $('sensor-hud-container');
const btnGrantSensors   = $('btn-grant-sensors');

function showWarning(on) {
  sensorWarningCard.hidden = !on;
  sensorHudContainer.hidden = on;
  if (!on) measureDial();
}

function onSensorDataReceived() {
  if (!sensorsActive) {
    sensorsActive = true;
    showWarning(false);
  }
}

async function requestSensors() {
  if (needsPermission) {
    try {
      const resp = await DeviceMotionEvent.requestPermission();
      if (resp === 'granted') {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          await DeviceOrientationEvent.requestPermission().catch(() => {});
        }
        initSensors();
      } else {
        $('txt-warn-desc').textContent = I18N[currentLang].warn_denied;
        btnGrantSensors.disabled = true;
      }
    } catch (err) {
      $('txt-warn-desc').textContent = I18N[currentLang].warn_denied;
    }
  } else {
    initSensors();
  }
}

function initSensors() {
  window.addEventListener('deviceorientation', onOrientation, true);
  window.addEventListener('devicemotion', onMotion, true);
}

btnGrantSensors.addEventListener('click', () => {
  requestSensors();
});

// Automatic Initial Sensor Startup or Permission Prompt
if (needsPermission) {
  showWarning(true);
} else {
  initSensors();
  // Watchdog: If no sensor events arrive within 700ms, display warning
  setTimeout(() => {
    if (!sensorsActive) showWarning(true);
  }, 700);
}

// Initial localization
setLanguage(currentLang);

</script>
</body>
</html>
